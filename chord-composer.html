      const voice = events[evIndex].pitches.slice().sort((a, b) => a - b).indexOf(note.midi);
      const stepOf = (p) => NS.notation.spellNote(p, chord, sharps()).step;
      const valid = edit.validPitches(chord, note.midi - 19, note.midi + 19);
      const steps = valid.map(stepOf).concat([stepOf(note.midi)]);

      notationUI.reserve({ minStep: Math.min.apply(null, steps) - 2, maxStep: Math.max.apply(null, steps) + 2 });
      const g = notationUI.getGeom();
      session = {
        pid: startEv.pointerId,
        chord,
        events,
        evIndex,
        voice,
        valid,
        stepOf,
        startX: sx,
        startY: sy,
        headY: g.stepY(stepOf(note.midi)), // where the head sits now that the staff may have grown
        target: evIndex,
        midi: note.midi,
        origMidi: note.midi,
        free: false,
        freeStep: null,
      };
      host.classList.add('is-note-dragging');
      doc.addEventListener('pointermove', onMove, true);
      doc.addEventListener('pointerup', onUp, true);
      doc.addEventListener('pointercancel', onCancel, true);
      doc.addEventListener('keydown', onKey, true);
      update(startEv);
    }

    function update(e) {
      const s = session;
      const g = notationUI.getGeom();
      const L = opts.getLayout();
      if (!s || !g || !L) return;
      const p = local(e);

      // sideways: the nearest note of the same chord (stays put until the pointer really moves)
      if (Math.abs(e.clientX - s.startX) >= SIDE_LOCK) {
        let best = s.target;
        let bestD = Infinity;
        s.events.forEach((ev, i) => {
          const cx = L.xOfTick(ev.tick) + (ev.dur * L.opts.tickW) / 2;
          const d = Math.abs(p.x - cx);
          if (d < bestD) {
            bestD = d;
            best = i;
          }
        });
        s.target = best;
      } else s.target = s.evIndex;

      // up/down: the nearest valid tone (Shift = any staff position)
      const step = g.stepAtY(s.headY + (e.clientY - s.startY));
      s.free = !!e.shiftKey;
      const others = new Set(s.events[s.target].pitches);
      if (s.target === s.evIndex) others.delete(s.origMidi);
      if (s.free) {
        s.freeStep = Math.round(step);
        s.midi = edit.midiForStep(s.freeStep, keyOf());
      } else {
        let best = null;
        s.valid.forEach((pm) => {
          if (others.has(pm)) return;
          const d = Math.abs(s.stepOf(pm) - step);
          if (best == null || d < best.d) best = { d, pm };
        });
        s.midi = best ? best.pm : s.origMidi;
      }
      notationUI.setOverlay(overlayMarkup(s));
    }

    function endNoteDrag(commit) {
      const s = session;
      if (!s) return;
      session = null;
      doc.removeEventListener('pointermove', onMove, true);
      doc.removeEventListener('pointerup', onUp, true);
      doc.removeEventListener('pointercancel', onCancel, true);
      doc.removeEventListener('keydown', onKey, true);
      host.classList.remove('is-note-dragging');
      notationUI.setOverlay('');
      notationUI.reserve(null);
      if (!commit) return;
      let pins;
      if (s.target === s.evIndex) {
        pins = edit.movePitch(s.chord, s.events, s.evIndex, s.voice, s.midi);
      } else {
        const moved = s.events[s.evIndex].pitches.slice().sort((a, b) => a - b).map((p, k) => (k === s.voice ? s.midi : p));
        pins = edit.reorderEvents(s.chord, s.events, s.evIndex, s.target, moved);
      }
      if (pins) {
        store.setPins(s.chord.id, pins, s.free);
        player.auditionNote(s.midi);
      }
    }

    const onMove = (e) => {
      if (!session || e.pointerId !== session.pid) return;
      e.preventDefault();
      update(e);
    };
    const onUp = (e) => {
      if (!session || e.pointerId !== session.pid) return;
      update(e);
      endNoteDrag(true);
    };
    const onCancel = (e) => {
      if (session && e.pointerId === session.pid) endNoteDrag(false);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') {
        e.stopPropagation();
        endNoteDrag(false);
      }
    };

    // ---- pointer entry ---------------------------------------------------------------------------------

    host.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || session) return;
      const hit = e.target.closest && e.target.closest('.cc-hit');
      if (hit) {
        const idx = Number(hit.dataset.n);
        const note = notationUI.getNotes()[idx];
        if (note) store.select(note.chordId);
        e.preventDefault();
        pending(
          e,
          (ev, sx, sy) => startNoteDrag(idx, ev, sx, sy),
          () => {
            const n = notationUI.getNotes()[idx];
            if (n) player.auditionNote(n.midi);
          }
        );
        return;
      }
      pending(e, null, (ev) => clickAt(ev));
    });

    return { isDragging: () => !!session, cancel: () => endNoteDrag(false) };
  }

  const api = { create };
  NS.uiEdit = api;
  if (typeof module === 'object' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ui-timeline.js — ruler (with time-signature blocks), chord track, draggable/resizable chord blocks,
 * popover editors and the engraved notation row. All drags (palette -> track, block move/resize, meter
 * block placement) use Pointer Events and render a *preview* computed by the pure functions in
 * timeline.js / meter.js; the store is only touched on release. Positions come from one shared layout
 * (meter.buildLayout) so the ruler, chords and notation always line up, whatever the time signature. */
(function (global) {
  'use strict';
  const NS = (global.ChordComposerModules = global.ChordComposerModules || {});
  const theory = NS.theory;
  const timeline = NS.timeline;
  const meterLib = NS.meter;
  const composer = NS.composer;
  const notation = NS.notation;
  const overlay = NS.overlay;

  const TICK_W = 14; // px per tick (sixteenth note); a quarter note is 56px
  const SIG_W = 54; // room a time-signature block takes in the flow
  const MIN_COVER = 128; // ticks always shown
  const DRAG_THRESHOLD = 5;
  const NEW_ID = '__new__';
  const NEW_METER_ID = '__newmeter__';

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function create(root, store, player) {
    const doc = root.ownerDocument;
    const app = root.closest('.cc-app') || root;

    root.innerHTML =
      '<div class="cc-tl-scroll" data-role="scroll">' +
      '  <div class="cc-tl-inner" data-role="inner">' +
      '    <div class="cc-gap-layer" data-role="gaps"></div>' +
      '    <div class="cc-ruler" data-role="ruler" title="Click to move the playhead"></div>' +
      '    <div class="cc-track" data-role="track">' +
      '      <div class="cc-grid" data-role="grid"></div>' +
      '      <div class="cc-empty-hint" data-role="hint">Drag a chord here to start composing</div>' +
      '    </div>' +
      '    <div class="cc-mods" data-role="mods">' +
      '      <div class="cc-mod-lane" data-lane="0" title="Articulation: drop Staccato or Slur here"><div class="cc-grid"></div><span class="cc-lane-label">articulation</span></div>' +
      '      <div class="cc-mod-lane" data-lane="1" title="Dynamics: drop Fade out or Fade in here"><div class="cc-grid"></div><span class="cc-lane-label">dynamics</span></div>' +
      '    </div>' +
      '    <div class="cc-notation" data-role="notation" title="Click an empty spot to drop a note · drag a note up/down (Shift = free) or sideways to reorder"></div>' +
      '    <div class="cc-playhead" data-role="playhead" hidden></div>' +
      '  </div>' +
      '</div>' +
      '<div class="cc-popover" data-role="popover" role="dialog" aria-label="Edit chord" hidden>' +
      '  <div class="cc-pop-row">' +
      '    <label>Root <select data-pop="root"></select></label>' +
      '    <label>Type <select data-pop="quality"></select></label>' +
      '  </div>' +
      '  <div class="cc-pop-row">' +
      '    <label>Octave <select data-pop="octave"></select></label>' +
      '    <label>Play as <select data-pop="mode"></select></label>' +
      '  </div>' +
      '  <div class="cc-pop-row">' +
      '    <span class="cc-pop-label">Length</span>' +
      '    <button type="button" class="cc-btn cc-btn-sm" data-pop="shorter" aria-label="Shorter">−</button>' +
      '    <output data-pop="len"></output>' +
      '    <button type="button" class="cc-btn cc-btn-sm" data-pop="longer" aria-label="Longer">+</button>' +
      '  </div>' +
      '  <div class="cc-pop-row cc-pop-actions">' +
      '    <button type="button" class="cc-btn cc-btn-sm" data-pop="listen">Listen</button>' +
      '    <button type="button" class="cc-btn cc-btn-sm cc-danger" data-pop="delete">Delete</button>' +
      '    <button type="button" class="cc-btn cc-btn-sm cc-btn-primary" data-pop="close">Done</button>' +
      '  </div>' +
      '</div>' +
      '<div class="cc-popover" data-role="meter-pop" role="dialog" aria-label="Edit time signature" hidden>' +
      '  <div class="cc-pop-row"><label>Preset <select data-mp="preset"></select></label></div>' +
      '  <div class="cc-pop-row">' +
      '    <label>Beats <input type="number" min="1" max="16" data-mp="num"></label>' +
      '    <label>Note <select data-mp="den"><option value="1">whole (1)</option><option value="2">half (2)</option><option value="4">quarter (4)</option><option value="8">eighth (8)</option><option value="16">sixteenth (16)</option></select></label>' +
      '  </div>' +
      '  <div class="cc-pop-row"><label>Beat pattern <input type="text" data-mp="groups" size="12" placeholder="e.g. 2/2+3" aria-label="Beat pattern, for example 2/2+3"></label></div>' +
      '  <div class="cc-pop-row"><span class="cc-pop-hint" data-mp="msg"></span></div>' +
      '  <div class="cc-pop-row cc-pop-actions">' +
      '    <button type="button" class="cc-btn cc-btn-sm cc-danger" data-mp="delete">Remove</button>' +
      '    <button type="button" class="cc-btn cc-btn-sm cc-btn-primary" data-mp="close">Done</button>' +
      '  </div>' +
      '</div>';

    const q = (r) => root.querySelector('[data-role="' + r + '"]');
    const scroll = q('scroll');
    const inner = q('inner');
    const ruler = q('ruler');
    const track = q('track');
    const grid = q('grid');
    const gaps = q('gaps');
    const hint = q('hint');
    const playhead = q('playhead');
    const pop = q('popover');
    const mpop = q('meter-pop');
    const notationUI = NS.uiNotation.create(q('notation'));
    const modsEl = q('mods');
    const laneEls = Array.from(modsEl.querySelectorAll('.cc-mod-lane'));
    const editor = NS.uiEdit.create({
      host: q('notation'),
      notationUI,
      store,
      player,
      getLayout: () => cur.layout,
      onAnchor: (tick) => api.onAnchor && api.onAnchor(tick / theory.TICKS_PER_QUARTER),
    });

    const blocks = new Map(); // chord id -> element
    const modBlocks = new Map(); // modifier id -> element
    const cur = { layout: null, gridSig: '' };
    let drag = null;
    let popId = null;
    let mpopId = null;
    let playingChordId = null;

    const sharps = () => theory.keyUsesSharps(store.state.key.root, store.state.key.mode);
    const nameOf = (c) => theory.chordName(c.root, c.quality, sharps());

    // ---------------------------------------------------------------- layout

    function computeLayout(chords, meters, cover) {
      const key = store.state.key;
      return meterLib.buildLayout(meters, cover != null ? cover : Math.max(MIN_COVER, timeline.songEndTick(chords) + 16), {
        gutter: notation.gutterWidth(key.root, key.mode),
        tickW: TICK_W,
        sigW: SIG_W,
        minWidth: scroll.clientWidth || 0,
        minMeasures: 8,
      });
    }

    const currentChords = () => (drag && drag.previewChords ? drag.previewChords : store.getChords());
    const currentMeters = () => (drag && drag.previewMeters ? drag.previewMeters : store.getMeters());
    const currentMods = () => (drag && drag.previewMods ? drag.previewMods : store.getMods());

    const PULSE_NAMES = { 16: 'whole', 8: 'half', 2: 'eighth', 1: 'sixteenth' };

    function lengthLabel(c, layout) {
      const m = layout.measureAtTick(c.startTick);
      if (m.pulseTicks === 4) {
        const beats = c.lengthTicks / 4;
        return beats + (beats === 1 ? ' beat' : ' beats');
      }
      const n = c.lengthTicks / m.pulseTicks;
      return n + ' ' + PULSE_NAMES[m.pulseTicks] + (n === 1 ? '' : 's');
    }

    const octaveOf = (c) => (c.octave == null ? theory.DEFAULT_OCTAVE : c.octave);
    const modeOf = (c) => c.mode || 'arp';

    // ---------------------------------------------------------------- rendering

    function sigBlockEl(b, left, initial) {
      const s = el('div', 'cc-sig' + (initial ? ' is-initial' : ''));
      s.dataset.meterId = b.id;
      s.style.left = left + 'px';
      s.tabIndex = 0;
      s.setAttribute('role', 'button');
      s.setAttribute('aria-label', 'Time signature ' + meterLib.labelOf(b) + ', beat pattern ' + meterLib.groupsLabel(b) + '. Enter to edit' + (initial ? '.' : ', Delete to remove.'));
      s.title = meterLib.labelOf(b) + ' (' + meterLib.groupsLabel(b) + ')' + (initial ? ' — click to change' : ' — drag to move, click to edit');
      s.appendChild(el('span', 'cc-sig-num', String(b.numerator)));
      s.appendChild(el('span', 'cc-sig-den', String(b.denominator)));
      return s;
    }

    function buildGrid(layout) {
      const sig = layout.measures.map((m) => [m.x, m.width, m.pulseTicks, m.block ? m.block.id + m.block.numerator + '/' + m.block.denominator + meterLib.groupsText(m.block.groups) : ''].join(',')).join('|') + '#' + layout.measures[0].meter.numerator + '/' + layout.measures[0].meter.denominator + meterLib.groupsText(layout.measures[0].meter.groups) + '#' + layout.opts.gutter;
      if (sig === cur.gridSig) return;
      cur.gridSig = sig;
      ruler.textContent = '';
      grid.textContent = '';
      gaps.textContent = '';
      const laneGrids = laneEls.map((l) => l.querySelector('.cc-grid'));
      laneGrids.forEach((g) => (g.textContent = ''));
      ruler.appendChild(sigBlockEl(Object.assign({ id: meterLib.INITIAL_ID }, layout.measures[0].meter), layout.opts.gutter - SIG_W - 2, true));
      layout.measures.forEach((m) => {
        const pulsePx = m.pulseTicks * TICK_W + 'px';
        const rc = el('div', 'cc-ruler-cell');
        rc.style.left = m.x + 'px';
        rc.style.width = m.width + 'px';
        rc.style.setProperty('--pulse', pulsePx);
        rc.appendChild(el('span', null, String(m.index + 1)));
        ruler.appendChild(rc);
        const tc = el('div', 'cc-cell');
        tc.style.left = m.x + 'px';
        tc.style.width = m.width + 'px';
        tc.style.setProperty('--pulse', pulsePx);
        grid.appendChild(tc);
        laneGrids.forEach((g) => g.appendChild(tc.cloneNode(false)));
        if (m.block) {
          ruler.appendChild(sigBlockEl(m.block, m.x - SIG_W + 2, false));
          const gap = el('div', 'cc-sig-gap');
          gap.style.left = m.x - SIG_W + 'px';
          gap.style.width = SIG_W + 'px';
          gaps.appendChild(gap);
        }
      });
    }

    function fillBlock(b, c, ghost, layout) {
      const sel = !ghost && store.getSelectedId() === c.id;
      const left = layout.xOfTick(c.startTick) + 2;
      const right = layout.xOfTick(c.startTick + c.lengthTicks, true) - 2;
      const width = Math.max(10, right - left);
      b.dataset.id = c.id;
      b.style.left = left + 'px';
      b.style.width = width + 'px';
      b.style.setProperty('--h', theory.hueForRoot(c.root));
      b.classList.toggle('is-ghost', !!ghost);
      b.classList.toggle('is-selected', sel);
      b.classList.toggle('is-playing', c.id === playingChordId);
      b.classList.toggle('is-narrow', width < 84);
      b.classList.toggle('is-tiny', width < 46);
      const name = nameOf(c);
      const roman = theory.romanFor(c, store.state.key.root, store.state.key.mode);
      const len = lengthLabel(c, layout);
      b.querySelector('.cc-block-name').textContent = name;
      const mode = theory.CHORD_MODES[modeOf(c)];
      b.querySelector('.cc-block-sub').textContent = [roman, mode.short, 'oct ' + octaveOf(c)].filter(Boolean).join(' · ');
      b.querySelector('.cc-block-badge').textContent = len;
      b.title = name + ' · ' + mode.label + ' · octave ' + octaveOf(c) + ' · ' + len;
      b.setAttribute('aria-label', name + ' chord, ' + mode.label + ', octave ' + octaveOf(c) + ', ' + len + ' long. Enter to edit, Delete to remove, arrow keys to move, Shift plus arrows to resize.');
      b.setAttribute('aria-pressed', sel ? 'true' : 'false');
    }

    function makeBlock() {
      const b = el('div', 'cc-block');
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.appendChild(el('div', 'cc-block-name'));
      b.appendChild(el('div', 'cc-block-sub'));
      b.appendChild(el('div', 'cc-block-badge'));
      const h = el('div', 'cc-handle');
      h.dataset.handle = '1';
      h.setAttribute('aria-hidden', 'true');
      b.appendChild(h);
      return b;
    }

    function fillMod(b, m, ghost, layout) {
      const info = theory.MODIFIERS[m.kind];
      const left = layout.xOfTick(m.startTick) + 2;
      const right = layout.xOfTick(m.startTick + m.lengthTicks, true) - 2;
      const width = Math.max(10, right - left);
      const sel = !ghost && store.getSelectedId() === m.id;
      b.dataset.id = m.id;
      b.style.left = left + 'px';
      b.style.width = width + 'px';
      b.style.setProperty('--h', info.hue);
      b.classList.toggle('is-ghost', !!ghost);
      b.classList.toggle('is-selected', sel);
      b.classList.toggle('is-tiny', width < 56);
      b.querySelector('.cc-mod-glyph').textContent = info.glyph;
      b.querySelector('.cc-mod-name').textContent = info.label;
      b.title = info.label + ' (' + info.hint + ') — drag to move, drag the right edge to resize, drag away or press Delete to remove';
      b.setAttribute('aria-label', info.label + ' modifier, ' + info.hint + '. Delete to remove.');
      b.setAttribute('aria-pressed', sel ? 'true' : 'false');
    }

    function makeModBlock(lane) {
      const b = el('div', 'cc-mod');
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.appendChild(el('span', 'cc-mod-glyph'));
      b.appendChild(el('span', 'cc-mod-name'));
      const h = el('div', 'cc-handle');
      h.dataset.handle = '1';
      h.setAttribute('aria-hidden', 'true');
      b.appendChild(h);
      laneEls[lane].appendChild(b);
      return b;
    }

    function render() {
      const chords = currentChords();
      const meters = currentMeters();
      const mods = currentMods();
      const layout = computeLayout(chords, meters);
      cur.layout = layout;
      inner.style.width = layout.totalWidth + 'px';
      buildGrid(layout);

      // reconcile chord blocks (reuse elements so focus survives re-renders)
      const wanted = new Set();
      chords.forEach((c) => {
        const ghost = !!drag && (drag.kind === 'new' || drag.kind === 'move') && drag.over && drag.valid && c.id === drag.id;
        let b = blocks.get(c.id);
        if (!b) {
          b = makeBlock();
          blocks.set(c.id, b);
          track.appendChild(b);
        }
        fillBlock(b, c, ghost, layout);
        wanted.add(c.id);
      });
      blocks.forEach((b, id) => {
        if (!wanted.has(id)) {
          b.remove();
          blocks.delete(id);
        }
      });
      hint.hidden = chords.length > 0;

      // modifier blocks (two lanes)
      const wantedMods = new Set();
      mods.forEach((m) => {
        const ghost = !!drag && (drag.kind === 'newMod' || drag.kind === 'moveMod') && drag.over && drag.valid && m.id === drag.id;
        let b = modBlocks.get(m.id);
        if (!b) {
          b = makeModBlock(theory.MODIFIERS[m.kind].lane);
          modBlocks.set(m.id, b);
        }
        fillMod(b, m, ghost, layout);
        wantedMods.add(m.id);
      });
      modBlocks.forEach((b, id) => {
        if (!wantedMods.has(id)) {
          b.remove();
          modBlocks.delete(id);
        }
      });

      // engraved melody (previewed live while dragging)
      const previewing = drag && (drag.previewChords || drag.previewMeters || drag.previewMods);
      const notes = previewing ? composer.compose(chords, meters, { seed: store.state.seed, mods }) : store.getNotes();
      notationUI.draw({ notes, chords, layout, key: store.state.key, mods });

      if (popId) {
        const c = store.getChords().find((x) => x.id === popId);
        if (!c) closePopovers();
        else refreshPopover(c);
      }
      if (mpopId) {
        const b = store.getMeters().find((x) => x.id === mpopId);
        if (!b) closePopovers();
        else refreshMeterPopover(b);
      }
    }

    // ---------------------------------------------------------------- playhead

    function setPlayhead(beat, follow) {
      if (beat == null || !cur.layout) {
        playhead.hidden = true;
        return;
      }
      const x = cur.layout.xOfTick(beat * theory.TICKS_PER_QUARTER);
      playhead.hidden = false;
      playhead.style.transform = 'translateX(' + x + 'px)';
      if (follow) {
        const left = scroll.scrollLeft;
        const right = left + scroll.clientWidth;
        if (x > right - 60 || x < left) scroll.scrollLeft = Math.max(0, x - 120);
      }
    }

    function setPlayingChord(id) {
      if (id === playingChordId) return;
      playingChordId = id;
      blocks.forEach((b, bid) => b.classList.toggle('is-playing', bid === id));
    }

    // ---------------------------------------------------------------- drag machinery

    const innerLeft = () => inner.getBoundingClientRect().left;

    function overTimeline(e) {
      const r = scroll.getBoundingClientRect();
      return e.clientX >= r.left - 10 && e.clientX <= r.right + 10 && e.clientY >= r.top - 24 && e.clientY <= r.bottom + 24;
    }

    function makeChordClone(chord) {
      const c = el('div', 'cc-block cc-drag-clone');
      c.style.setProperty('--h', theory.hueForRoot(chord.root));
      c.style.width = chord.lengthTicks * TICK_W - 6 + 'px';
      c.appendChild(el('div', 'cc-block-name', nameOf(chord)));
      const roman = theory.romanFor(chord, store.state.key.root, store.state.key.mode);
      c.appendChild(el('div', 'cc-block-sub', roman || theory.QUALITIES[chord.quality].long));
      app.appendChild(c);
      return c;
    }

    function makeMeterClone(m) {
      const c = el('div', 'cc-sig cc-drag-clone cc-sig-clone');
      c.appendChild(el('span', 'cc-sig-num', String(m.numerator)));
      c.appendChild(el('span', 'cc-sig-den', String(m.denominator)));
      app.appendChild(c);
      return c;
    }

    function moveClone(e) {
      drag.clone.style.transform = 'translate(' + (e.clientX - drag.grabX) + 'px,' + (e.clientY - 34) + 'px)';
    }

    function updateDrag(e) {
      drag.lastX = e.clientX;
      drag.lastY = e.clientY;
      const L = drag.layout;

      if (drag.kind === 'resize') {
        const x = e.clientX - innerLeft();
        const pulse = L.measureAtTick(drag.startTick).pulseTicks;
        const endT = L.snapTick(L.tickFromX(x));
        drag.length = Math.max(pulse, endT - drag.startTick);
        const next = timeline.resizeChord(drag.baseChords, drag.id, drag.length);
        drag.valid = next !== drag.baseChords || drag.length === drag.baseLength;
        drag.previewChords = next;
        drag.over = true;
        render();
        return;
      }

      if (drag.kind === 'resizeMod') {
        const x = e.clientX - innerLeft();
        const pulse = L.measureAtTick(drag.startTick).pulseTicks;
        const endT = L.snapTick(L.tickFromX(x));
        drag.length = Math.max(pulse, endT - drag.startTick);
        const next = overlay.resizeMod(drag.baseMods, drag.id, drag.length);
        drag.valid = next !== drag.baseMods || drag.length === drag.baseLength;
        drag.previewMods = next;
        drag.over = true;
        render();
        return;
      }

      moveClone(e);
      drag.over = overTimeline(e);

      if (drag.kind === 'newMod' || drag.kind === 'moveMod') {
        if (drag.over) {
          const tick = L.snapTick(L.tickFromX(e.clientX - drag.grabX - innerLeft()));
          drag.tick = tick;
          if (drag.kind === 'newMod') {
            drag.template.lengthTicks = L.measureAtTick(tick).lengthTicks; // a new modifier spans one measure
            drag.clone.style.width = drag.template.lengthTicks * TICK_W - 6 + 'px';
          }
          const orig = drag.kind === 'moveMod' ? drag.baseMods.find((m) => m.id === drag.id) : null;
          const next = overlay.placeMod(drag.baseMods, Object.assign({}, orig || {}, { id: drag.id, kind: drag.template.kind, lengthTicks: drag.template.lengthTicks }), tick);
          drag.valid = next !== drag.baseMods;
          drag.previewMods = drag.valid ? next : drag.baseMods;
        } else {
          drag.valid = false;
          drag.previewMods = drag.kind === 'moveMod' ? overlay.removeMod(drag.baseMods, drag.id) : drag.baseMods;
        }
        drag.clone.classList.toggle('is-removing', drag.kind === 'moveMod' && !drag.over);
        drag.clone.classList.toggle('is-invalid', drag.over && !drag.valid);
        render();
        return;
      }

      if (drag.kind === 'newMeter' || drag.kind === 'moveMeter') {
        if (drag.over) {
          drag.at = L.boundaryFromX(e.clientX - innerLeft());
          const next = meterLib.placeMeter(drag.metersWithout, drag.block, drag.at);
          drag.valid = true;
          drag.previewMeters = next;
        } else {
          drag.valid = false;
          drag.previewMeters = drag.metersWithout;
        }
        drag.clone.classList.toggle('is-removing', drag.kind === 'moveMeter' && !drag.over);
        render();
        return;
      }

      if (drag.over) {
        const leftX = e.clientX - drag.grabX - innerLeft();
        const tick = L.snapTick(L.tickFromX(leftX));
        drag.tick = tick;
        if (drag.kind === 'new') {
          drag.template.lengthTicks = L.measureAtTick(tick).lengthTicks; // a new chord fills one measure
          drag.clone.style.width = drag.template.lengthTicks * TICK_W - 6 + 'px';
        }
        const orig = drag.kind === 'move' ? drag.baseChords.find((c) => c.id === drag.id) : null;
        const chord = Object.assign({}, orig || { octave: drag.template.octave, mode: drag.template.mode }, { id: drag.id, root: drag.template.root, quality: drag.template.quality, lengthTicks: drag.template.lengthTicks });
        const next = timeline.placeChord(drag.baseChords, chord, tick);
        drag.valid = next !== drag.baseChords;
        drag.previewChords = drag.valid ? next : drag.baseChords;
      } else {
        drag.valid = false;
        drag.previewChords = drag.kind === 'move' ? timeline.removeChord(drag.baseChords, drag.id) : drag.baseChords;
      }
      drag.clone.classList.toggle('is-removing', drag.kind === 'move' && !drag.over);
      drag.clone.classList.toggle('is-invalid', drag.over && !drag.valid);
      render();
    }

    function autoScrollLoop() {
      if (!drag) return;
      const r = scroll.getBoundingClientRect();
      if (drag.over || drag.kind === 'resize' || drag.kind === 'resizeMod') {
        let dx = 0;
        if (drag.lastX > r.right - 48) dx = Math.min(18, (drag.lastX - (r.right - 48)) / 3 + 2);
        else if (drag.lastX < r.left + 48) dx = -Math.min(18, (r.left + 48 - drag.lastX) / 3 + 2);
        if (dx) {
          const before = scroll.scrollLeft;
          scroll.scrollLeft += dx;
          if (scroll.scrollLeft !== before) updateDrag({ clientX: drag.lastX, clientY: drag.lastY });
        }
      }
      drag.raf = global.requestAnimationFrame(autoScrollLoop);
    }

    function endDrag(commit) {
      if (!drag) return;
      const d = drag;
      drag = null;
      doc.removeEventListener('pointermove', onDragMove, true);
      doc.removeEventListener('pointerup', onDragUp, true);
      doc.removeEventListener('pointercancel', onDragCancel, true);
      doc.removeEventListener('keydown', onDragKey, true);
      global.cancelAnimationFrame(d.raf);
      if (d.clone) d.clone.remove();
      root.classList.remove('is-dragging');
      app.classList.remove('is-dragging-chord');
      if (commit) {
        if (d.kind === 'new' && d.over && d.valid) {
          const id = store.addChord(d.template, d.tick);
          if (id) {
            const c = store.getChords().find((x) => x.id === id);
            if (c) player.auditionChord(c.root, c.quality);
          }
        } else if (d.kind === 'move') {
          if (!d.over) store.removeChord(d.id);
          else if (d.valid) store.moveChord(d.id, d.tick);
        } else if (d.kind === 'resize' && d.valid) {
          store.resizeChord(d.id, d.length);
        } else if (d.kind === 'newMod' && d.over && d.valid) {
          store.addMod(d.template, d.tick);
        } else if (d.kind === 'moveMod') {
          if (!d.over) store.removeMod(d.id);
          else if (d.valid) store.moveMod(d.id, d.tick);
        } else if (d.kind === 'resizeMod' && d.valid) {
          store.resizeMod(d.id, d.length);
        } else if (d.kind === 'newMeter' && d.over) {
          store.addMeter(d.block, d.at);
        } else if (d.kind === 'moveMeter') {
          if (!d.over) store.removeMeter(d.block.id);
          else store.moveMeter(d.block.id, d.at);
        }
      }
      render();
    }

    const onDragMove = (e) => {
      if (!drag || e.pointerId !== drag.pointerId) return;
      e.preventDefault();
      updateDrag(e);
    };
    const onDragUp = (e) => {
      if (!drag || e.pointerId !== drag.pointerId) return;
      updateDrag(e);
      endDrag(true);
    };
    const onDragCancel = (e) => {
      if (drag && e.pointerId === drag.pointerId) endDrag(false);
    };
    const onDragKey = (e) => {
      if (e.key === 'Escape') {
        e.stopPropagation();
        endDrag(false);
      }
    };

    function beginDrag(d, e) {
      closePopovers();
      const baseChords = store.getChords();
      const baseMeters = store.getMeters();
      const baseMods = store.getMods();
      const metersWithout = d.kind === 'moveMeter' ? meterLib.removeMeter(baseMeters, d.block.id) : baseMeters;
      drag = Object.assign(
        {
          pointerId: e.pointerId,
          baseChords,
          baseMeters,
          baseMods,
          metersWithout,
          over: false,
          valid: false,
          previewMods: null,
          previewChords: null,
          previewMeters: null,
          lastX: e.clientX,
          lastY: e.clientY,
        },
        d
      );
      // a stable layout for hit-testing: meters without the dragged block, wide enough for any drop
      drag.layout = computeLayout(baseChords, metersWithout, timeline.MAX_TICKS + 16);
      doc.addEventListener('pointermove', onDragMove, true);
      doc.addEventListener('pointerup', onDragUp, true);
      doc.addEventListener('pointercancel', onDragCancel, true);
      doc.addEventListener('keydown', onDragKey, true);
      root.classList.add('is-dragging');
      app.classList.add('is-dragging-chord');
      if (drag.clone) moveClone(e);
      drag.raf = global.requestAnimationFrame(autoScrollLoop);
      updateDrag(e);
    }

    /** Palette chips call this once dragged past the threshold. template: {kind:'chord'|'meter', ...} */
    function makeModClone(kind, lengthTicks) {
      const info = theory.MODIFIERS[kind];
      const c = el('div', 'cc-mod cc-drag-clone');
      c.style.setProperty('--h', info.hue);
      c.style.width = lengthTicks * TICK_W - 6 + 'px';
      c.appendChild(el('span', 'cc-mod-glyph', info.glyph));
      c.appendChild(el('span', 'cc-mod-name', info.label));
      app.appendChild(c);
      return c;
    }

    function beginPaletteDrag(e, template) {
      if (template.kind === 'mod') {
        const len = ((cur.layout && cur.layout.measures[0]) || { lengthTicks: 16 }).lengthTicks;
        const tmpl = { kind: template.modKind, lengthTicks: len };
        beginDrag({ kind: 'newMod', id: NEW_ID, template: tmpl, clone: makeModClone(tmpl.kind, len), grabX: (len * TICK_W) / 2 }, e);
        return;
      }
      if (template.kind === 'meter') {
        const block = Object.assign({ id: NEW_METER_ID }, meterLib.normalize(template));
        beginDrag({ kind: 'newMeter', block, clone: makeMeterClone(block), grabX: 26 }, e);
        return;
      }
      const m = (cur.layout && cur.layout.measures[0]) || { lengthTicks: 16 };
      const chord = { root: template.root, quality: template.quality, octave: store.state.defaults.octave, mode: store.state.defaults.mode, lengthTicks: m.lengthTicks };
      beginDrag({ kind: 'new', id: NEW_ID, template: chord, clone: makeChordClone(chord), grabX: (chord.lengthTicks * TICK_W) / 2 }, e);
    }

    // ---- shared "pending" pointer logic: click vs drag ----------------------------------------------

    function pendingPointer(e, onDrag, onClick) {
      const startX = e.clientX;
      const startY = e.clientY;
      const pid = e.pointerId;
      const cleanup = () => {
        doc.removeEventListener('pointermove', move, true);
        doc.removeEventListener('pointerup', up, true);
        doc.removeEventListener('pointercancel', cleanup, true);
      };
      const move = (ev) => {
        if (ev.pointerId !== pid) return;
        if (Math.hypot(ev.clientX - startX, ev.clientY - startY) < DRAG_THRESHOLD) return;
        cleanup();
        onDrag(ev, startX);
      };
      const up = (ev) => {
        if (ev.pointerId !== pid) return;
        cleanup();
        onClick();
      };
      doc.addEventListener('pointermove', move, true);
      doc.addEventListener('pointerup', up, true);
      doc.addEventListener('pointercancel', cleanup, true);
    }

    // chord blocks
    track.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const blockEl = e.target.closest('.cc-block');
      if (!blockEl) {
        store.select(null);
        if (cur.layout && api.onAnchor) api.onAnchor(cur.layout.snapTick(cur.layout.tickFromX(e.clientX - innerLeft())) / theory.TICKS_PER_QUARTER);
        return;
      }
      const id = blockEl.dataset.id;
      const chord = store.getChords().find((c) => c.id === id);
      if (!chord) return;
      store.select(id);
      closePopovers();

      if (e.target.closest('.cc-handle')) {
        e.preventDefault();
        beginDrag({ kind: 'resize', id, startTick: chord.startTick, baseLength: chord.lengthTicks, length: chord.lengthTicks }, e);
        return;
      }
      const rect = blockEl.getBoundingClientRect();
      pendingPointer(
        e,
        (ev, startX) => {
          const tmpl = { root: chord.root, quality: chord.quality, lengthTicks: chord.lengthTicks };
          beginDrag({ kind: 'move', id, template: tmpl, clone: makeChordClone(tmpl), grabX: startX - rect.left }, ev);
        },
        () => player.auditionChord(chord.root, chord.quality)
      );
    });

    // modifier blocks: drag to move (off the bar to remove), right edge to resize
    modsEl.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const blockEl = e.target.closest('.cc-mod');
      if (!blockEl) {
        store.select(null);
        if (cur.layout && api.onAnchor) api.onAnchor(cur.layout.snapTick(cur.layout.tickFromX(e.clientX - innerLeft())) / theory.TICKS_PER_QUARTER);
        return;
      }
      const id = blockEl.dataset.id;
      const mod = store.getMods().find((m) => m.id === id);
      if (!mod) return;
      store.select(id);
      closePopovers();
      if (e.target.closest('.cc-handle')) {
        e.preventDefault();
        beginDrag({ kind: 'resizeMod', id, startTick: mod.startTick, baseLength: mod.lengthTicks, length: mod.lengthTicks }, e);
        return;
      }
      const rect = blockEl.getBoundingClientRect();
      pendingPointer(
        e,
        (ev, startX) => {
          const tmpl = { kind: mod.kind, lengthTicks: mod.lengthTicks };
          beginDrag({ kind: 'moveMod', id, template: tmpl, clone: makeModClone(mod.kind, mod.lengthTicks), grabX: startX - rect.left }, ev);
        },
        () => {}
      );
    });
    modsEl.addEventListener('focusin', (e) => {
      const b = e.target.closest && e.target.closest('.cc-mod');
      if (b && b.dataset.id !== store.getSelectedId()) store.select(b.dataset.id);
    });

    track.addEventListener('dblclick', (e) => {
      const b = e.target.closest('.cc-block');
      if (b) openPopover(b.dataset.id);
    });
    track.addEventListener('contextmenu', (e) => {
      const b = e.target.closest('.cc-block');
      if (b) {
        e.preventDefault();
        store.select(b.dataset.id);
        openPopover(b.dataset.id);
      }
    });
    track.addEventListener('focusin', (e) => {
      const b = e.target.closest && e.target.closest('.cc-block');
      if (b && b.dataset.id !== store.getSelectedId()) store.select(b.dataset.id);
    });

    // ruler: click = seek, time-signature blocks = edit / drag
    ruler.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const sigEl = e.target.closest('.cc-sig');
      if (sigEl) {
        const id = sigEl.dataset.meterId;
        const block = store.getMeters().find((b) => b.id === id);
        if (!block) return;
        closePopovers();
        if (id === meterLib.INITIAL_ID) {
          pendingPointer(e, () => {}, () => openMeterPopover(id));
          return;
        }
        const rect = sigEl.getBoundingClientRect();
        pendingPointer(
          e,
          (ev, startX) => beginDrag({ kind: 'moveMeter', block, clone: makeMeterClone(block), grabX: startX - rect.left }, ev),
          () => openMeterPopover(id)
        );
        return;
      }
      if (!cur.layout) return;
      const L = cur.layout;
      const tick = L.snapTick(L.tickFromX(e.clientX - innerLeft()));
      if (api.onSeek) api.onSeek(tick / theory.TICKS_PER_QUARTER);
    });
    ruler.addEventListener('keydown', (e) => {
      const sigEl = e.target.closest && e.target.closest('.cc-sig');
      if (!sigEl) return;
      const id = sigEl.dataset.meterId;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openMeterPopover(id);
      } else if ((e.key === 'Delete' || e.key === 'Backspace') && id !== meterLib.INITIAL_ID) {
        e.preventDefault();
        store.removeMeter(id);
      }
    });

    // ---------------------------------------------------------------- chord popover

    const popRoot = pop.querySelector('[data-pop="root"]');
    const popQuality = pop.querySelector('[data-pop="quality"]');
    const popLen = pop.querySelector('[data-pop="len"]');
    const popOctave = pop.querySelector('[data-pop="octave"]');
    const popMode = pop.querySelector('[data-pop="mode"]');
    for (let o = theory.MIN_OCTAVE; o <= theory.MAX_OCTAVE; o++) {
      const opt = el('option', null, String(o) + (o === theory.DEFAULT_OCTAVE ? ' (middle)' : ''));
      opt.value = String(o);
      popOctave.appendChild(opt);
    }
    theory.MODE_ORDER.forEach((k) => {
      const opt = el('option', null, theory.CHORD_MODES[k].label);
      opt.value = k;
      popMode.appendChild(opt);
    });

    function fillSelects() {
      popRoot.textContent = '';
      for (let i = 0; i < 12; i++) {
        const o = el('option', null, theory.noteName(i, sharps()));
        o.value = String(i);
        popRoot.appendChild(o);
      }
      popQuality.textContent = '';
      theory.QUALITY_ORDER.forEach((k) => {
        const o = el('option', null, theory.QUALITIES[k].long);
        o.value = k;
        popQuality.appendChild(o);
      });
    }
    fillSelects();

    const pulseOf = (c) => (cur.layout ? cur.layout.measureAtTick(c.startTick).pulseTicks : 4);

    function refreshPopover(c) {
      popRoot.value = String(c.root);
      popQuality.value = c.quality;
      popOctave.value = String(octaveOf(c));
      popMode.value = modeOf(c);
      popLen.textContent = cur.layout ? lengthLabel(c, cur.layout) : '';
    }

    function placePopover(popEl, anchor) {
      if (!anchor) return;
      const pr = root.getBoundingClientRect();
      const br = anchor.getBoundingClientRect();
      popEl.hidden = false;
      const w = popEl.offsetWidth;
      let left = br.left - pr.left;
      left = Math.max(4, Math.min(left, pr.width - w - 4));
      popEl.style.left = left + 'px';
      popEl.style.top = br.bottom - pr.top + 8 + 'px';
    }

    function openPopover(id) {
      const c = store.getChords().find((x) => x.id === id);
      if (!c) return;
      closePopovers();
      fillSelects();
      popId = id;
      refreshPopover(c);
      const b = blocks.get(id);
      if (b) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      placePopover(pop, b);
      popRoot.focus();
    }

    function closePopovers() {
      const focusBack = popId ? blocks.get(popId) : mpopId ? ruler.querySelector('[data-meter-id="' + mpopId + '"]') : null;
      const hadFocus = (popId || mpopId) && doc.activeElement && (pop.contains(doc.activeElement) || mpop.contains(doc.activeElement));
      popId = null;
      mpopId = null;
      pop.hidden = true;
      mpop.hidden = true;
      if (hadFocus && focusBack) focusBack.focus();
    }

    popRoot.addEventListener('change', () => popId && store.updateChord(popId, { root: Number(popRoot.value) }));
    popQuality.addEventListener('change', () => popId && store.updateChord(popId, { quality: popQuality.value }));
    popOctave.addEventListener('change', () => popId && store.updateChord(popId, { octave: Number(popOctave.value) }));
    popMode.addEventListener('change', () => popId && store.updateChord(popId, { mode: popMode.value }));
    pop.addEventListener('click', (e) => {
      const act = e.target.closest('[data-pop]');
      if (!act || !popId) return;
      const c = store.getChords().find((x) => x.id === popId);
      if (!c) return;
      const pulse = pulseOf(c);
      switch (act.dataset.pop) {
        case 'shorter':
          if (c.lengthTicks - pulse >= pulse) store.resizeChord(popId, c.lengthTicks - pulse);
          break;
        case 'longer':
          store.resizeChord(popId, c.lengthTicks + pulse);
          break;
        case 'listen':
          player.auditionChord(c.root, c.quality);
          break;
        case 'delete': {
          const id = popId;
          closePopovers();
          store.removeChord(id);
          break;
        }
        case 'close':
          closePopovers();
          break;
        default:
      }
    });

    // ---------------------------------------------------------------- meter popover

    const mp = (n) => mpop.querySelector('[data-mp="' + n + '"]');
    const mpPreset = mp('preset');
    const mpNum = mp('num');
    const mpDen = mp('den');
    const mpGroups = mp('groups');
    const mpMsg = mp('msg');
    const mpDelete = mp('delete');

    meterLib.PRESETS.forEach((p, i) => {
      const o = el('option', null, meterLib.labelOf(p) + '  (' + meterLib.groupsLabel(p) + ')');
      o.value = String(i);
      mpPreset.appendChild(o);
    });
    const custom = el('option', null, 'Custom');
    custom.value = 'custom';
    mpPreset.appendChild(custom);

    function refreshMeterPopover(b) {
      const idx = meterLib.PRESETS.findIndex((p) => meterLib.sameMeter(p, b));
      mpPreset.value = idx >= 0 ? String(idx) : 'custom';
      mpNum.value = String(b.numerator);
      mpDen.value = String(b.denominator);
      if (doc.activeElement !== mpGroups) {
        mpGroups.value = meterLib.groupsText(b.groups);
        mpGroups.classList.remove('is-invalid');
        mpMsg.textContent = meterLib.PATTERN_HINT;
      }
      mpDelete.hidden = b.id === meterLib.INITIAL_ID;
    }

    function openMeterPopover(id) {
      const b = store.getMeters().find((x) => x.id === id);
      if (!b) return;
      closePopovers();
      mpopId = id;
      refreshMeterPopover(b);
      placePopover(mpop, ruler.querySelector('[data-meter-id="' + id + '"]'));
      mpNum.focus();
    }

    mpPreset.addEventListener('change', () => {
      const p = meterLib.PRESETS[Number(mpPreset.value)];
      if (p && mpopId) store.updateMeter(mpopId, { numerator: p.numerator, denominator: p.denominator, groups: p.groups });
    });
    mpNum.addEventListener('change', () => mpopId && store.updateMeter(mpopId, { numerator: Number(mpNum.value) }));
    mpDen.addEventListener('change', () => mpopId && store.updateMeter(mpopId, { denominator: Number(mpDen.value) }));
    mpGroups.addEventListener('input', () => {
      if (!mpopId) return;
      const b = store.getMeters().find((x) => x.id === mpopId);
      if (!b) return;
      const r = meterLib.checkGroups(mpGroups.value, b.numerator, b.denominator);
      mpGroups.classList.toggle('is-invalid', !r.ok);
      mpMsg.textContent = r.message;
      if (r.ok) store.updateMeter(mpopId, { groups: r.groups });
    });
    mpop.addEventListener('click', (e) => {
      const act = e.target.closest('[data-mp]');
      if (!act || !mpopId) return;
      if (act.dataset.mp === 'close') closePopovers();
      else if (act.dataset.mp === 'delete') {
        const id = mpopId;
        closePopovers();
        store.removeMeter(id);
      }
    });

    [pop, mpop].forEach((p) =>
      p.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.stopPropagation();
          closePopovers();
        }
      })
    );
    doc.addEventListener(
      'pointerdown',
      (e) => {
        if ((popId || mpopId) && !pop.contains(e.target) && !mpop.contains(e.target) && !(e.target.closest && (e.target.closest('.cc-block') || e.target.closest('.cc-sig')))) closePopovers();
      },
      true
    );
    scroll.addEventListener('scroll', () => {
      if (popId) placePopover(pop, blocks.get(popId));
      if (mpopId) placePopover(mpop, ruler.querySelector('[data-meter-id="' + mpopId + '"]'));
    });
    global.addEventListener('resize', () => render());

    const api = {
      render,
      beginPaletteDrag,
      setPlayhead,
      setPlayingChord,
      setPlayingBeat: (beat) => notationUI.setPlaying(beat == null ? null : beat * theory.TICKS_PER_QUARTER),
      openPopover,
      closePopover: closePopovers,
      isPopoverOpen: () => !!(popId || mpopId),
      isDragging: () => !!drag,
      cancelDrag: () => endDrag(false),
      pulseAtTick: (t) => (cur.layout ? cur.layout.measureAtTick(t).pulseTicks : 4),
      measureLayout: () => cur.layout,
      getSvg: () => notationUI.getSvg(),
      songEndBeat: () => store.getEndBeat(),
      scrollToStart: () => {
        scroll.scrollLeft = 0;
      },

<script>
/* ui-palette.js — palette of draggable chips: "In key" diatonic chords, a "Custom" chord builder and
 * "Time signature" blocks (presets + a custom beat-pattern builder).
 * Click = hear it, drag onto the timeline = place it, Enter/double-click = append at the end. */
(function (global) {
  'use strict';
  const NS = (global.ChordComposerModules = global.ChordComposerModules || {});
  const theory = NS.theory;
  const timeline = NS.timeline;
  const meterLib = NS.meter;

  const DRAG_THRESHOLD = 5;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function create(root, store, player, timelineUI) {
    const doc = root.ownerDocument;
    let tab = 'key';
    let sevenths = false;
    let custom = { root: 0, quality: 'maj' };
    let customMeter = meterLib.normalize({ numerator: 5, denominator: 4, groups: [3, 2] });
    let signature = '';

    root.innerHTML =
      '<div class="cc-pal-head">' +
      '  <div class="cc-tabs" role="tablist">' +
      '    <button type="button" class="cc-tab" role="tab" data-tab="key">In key</button>' +
      '    <button type="button" class="cc-tab" role="tab" data-tab="custom">Custom chord</button>' +
      '    <button type="button" class="cc-tab" role="tab" data-tab="meter">Time signature</button>' +
      '    <button type="button" class="cc-tab" role="tab" data-tab="mods">Modifiers</button>' +
      '  </div>' +
      '  <label class="cc-check" data-role="sevenths-wrap"><input type="checkbox" data-role="sevenths"> 7ths</label>' +
      '  <span class="cc-pal-hint" data-role="hint"></span>' +
      '</div>' +
      '<div class="cc-pal-body" data-role="body"></div>';
    const body = root.querySelector('[data-role="body"]');
    const sevensBox = root.querySelector('[data-role="sevenths"]');
    const sevensWrap = root.querySelector('[data-role="sevenths-wrap"]');
    const hintEl = root.querySelector('[data-role="hint"]');

    const sharps = () => theory.keyUsesSharps(store.state.key.root, store.state.key.mode);

    function chordChip(c, sub) {
      const b = el('button', 'cc-chip');
      b.type = 'button';
      b.style.setProperty('--h', theory.hueForRoot(c.root));
      b.dataset.root = c.root;
      b.dataset.quality = c.quality;
      b.appendChild(el('span', 'cc-chip-name', theory.chordName(c.root, c.quality, sharps())));
      b.appendChild(el('span', 'cc-chip-sub', sub || theory.QUALITIES[c.quality].long));
      b.setAttribute('aria-label', theory.chordName(c.root, c.quality, sharps()) + ' chord. Drag to the timeline, or press Enter to add it at the end.');
      return b;
    }

    function fillMeterChip(b, m) {
      b.dataset.meter = JSON.stringify(m);
      b.textContent = '';
      b.appendChild(el('span', 'cc-chip-name', meterLib.labelOf(m)));
      b.appendChild(el('span', 'cc-chip-sub', meterLib.groupsLabel(m)));
      b.setAttribute('aria-label', meterLib.labelOf(m) + ' time signature, beat pattern ' + meterLib.groupsLabel(m) + '. Drag to a bar line on the timeline, or press Enter to add it after the last chord.');
    }

    function meterChip(m) {
      const b = el('button', 'cc-chip cc-chip-meter');
      b.type = 'button';
      b.style.setProperty('--h', 38);
      fillMeterChip(b, m);
      return b;
    }

    function build() {
      body.textContent = '';
      root.querySelectorAll('.cc-tab').forEach((t) => {
        const on = t.dataset.tab === tab;
        t.classList.toggle('is-active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      sevensWrap.hidden = tab !== 'key';
      hintEl.textContent =
        tab === 'meter'
          ? 'Drag a time signature to a bar line — everything after it follows the new beat pattern'
          : tab === 'mods'
            ? 'Drag a modifier onto the lane above the sheet music — it shapes every note under it'
            : 'Drag a chord onto the timeline · click to listen';

      if (tab === 'mods') {
        const row = el('div', 'cc-chip-row');
        theory.MODIFIER_ORDER.forEach((k) => {
          const info = theory.MODIFIERS[k];
          const b = el('button', 'cc-chip cc-chip-mod');
          b.type = 'button';
          b.style.setProperty('--h', info.hue);
          b.dataset.mod = k;
          b.appendChild(el('span', 'cc-chip-name', info.glyph + ' ' + info.label));
          b.appendChild(el('span', 'cc-chip-sub', info.hint));
          b.setAttribute('aria-label', info.label + ' modifier, ' + info.hint + '. Drag onto the modifier lane, or press Enter to add it over the last chord.');
          row.appendChild(b);
        });
        body.appendChild(row);
        return;
      }

      if (tab === 'key') {
        const row = el('div', 'cc-chip-row');
        theory.diatonicChords(store.state.key.root, store.state.key.mode, sevenths).forEach((d) => row.appendChild(chordChip(d, d.roman)));
        body.appendChild(row);
        return;
      }

      if (tab === 'meter') {
        const row = el('div', 'cc-chip-row');
        meterLib.PRESETS.forEach((p) => row.appendChild(meterChip(p)));
        body.appendChild(row);

        const wrap = el('div', 'cc-custom cc-meter-builder');
        wrap.innerHTML =
          '<span class="cc-pop-label">Build your own</span>' +
          '<label>Beats <input type="number" min="1" max="16" data-cm="num" aria-label="Beats per measure"></label>' +
          '<label>Note <select data-cm="den" aria-label="Note value of one beat"><option value="1">whole (1)</option><option value="2">half (2)</option><option value="4">quarter (4)</option><option value="8">eighth (8)</option><option value="16">sixteenth (16)</option></select></label>' +
          '<label>Beat pattern <input type="text" size="12" data-cm="groups" placeholder="e.g. 2/2+3" aria-label="Beat pattern, for example 2/2+3"></label>' +
          '<span class="cc-pop-hint" data-cm="msg"></span>';
        const out = el('div', 'cc-custom-out');
        const chip = meterChip(customMeter);
        out.appendChild(chip);
        wrap.appendChild(out);
        body.appendChild(wrap);

        const num = wrap.querySelector('[data-cm="num"]');
        const den = wrap.querySelector('[data-cm="den"]');
        const groups = wrap.querySelector('[data-cm="groups"]');
        const msg = wrap.querySelector('[data-cm="msg"]');
        const sync = () => {
          num.value = String(customMeter.numerator);
          den.value = String(customMeter.denominator);
          if (doc.activeElement !== groups) groups.value = meterLib.groupsText(customMeter.groups);
          fillMeterChip(chip, customMeter);
        };
        sync();
        msg.textContent = meterLib.PATTERN_HINT;
        num.addEventListener('change', () => {
          customMeter = meterLib.normalize({ numerator: Number(num.value), denominator: customMeter.denominator });
          groups.classList.remove('is-invalid');
          sync();
        });
        den.addEventListener('change', () => {
          customMeter = meterLib.normalize({ numerator: customMeter.numerator, denominator: Number(den.value) });
          groups.classList.remove('is-invalid');
          sync();
        });
        groups.addEventListener('input', () => {
          const r = meterLib.checkGroups(groups.value, customMeter.numerator, customMeter.denominator);
          groups.classList.toggle('is-invalid', !r.ok);
          msg.textContent = r.message;
          if (r.ok) {
            customMeter = meterLib.normalize({ numerator: customMeter.numerator, denominator: customMeter.denominator, groups: r.groups });
            sync();
          }
        });
        return;
      }

      const wrap = el('div', 'cc-custom');
      const roots = el('div', 'cc-pick cc-pick-roots');
      for (let i = 0; i < 12; i++) {
        const b = el('button', 'cc-pill', theory.noteName(i, sharps()));
        b.type = 'button';
        b.dataset.pickRoot = i;
        b.classList.toggle('is-active', custom.root === i);
        roots.appendChild(b);
      }
      const quals = el('div', 'cc-pick cc-pick-quals');
      theory.QUALITY_ORDER.forEach((k) => {
        const b = el('button', 'cc-pill', theory.QUALITIES[k].long);
        b.type = 'button';
        b.dataset.pickQuality = k;
        b.classList.toggle('is-active', custom.quality === k);
        quals.appendChild(b);
      });
      const out = el('div', 'cc-custom-out');
      out.appendChild(chordChip(custom, 'drag me'));
      wrap.appendChild(roots);
      wrap.appendChild(quals);
      wrap.appendChild(out);
      body.appendChild(wrap);
    }

    function refresh() {
      const sig = [tab, sevenths, store.state.key.root, store.state.key.mode, custom.root, custom.quality].join('|');
      if (sig === signature) return;
      signature = sig;
      sevensBox.checked = sevenths;
      build();
    }

    root.addEventListener('click', (e) => {
      const t = e.target.closest('[data-tab]');
      if (t) {
        tab = t.dataset.tab;
        refresh();
        return;
      }
      const r = e.target.closest('[data-pick-root]');
      if (r) {
        custom.root = Number(r.dataset.pickRoot);
        player.auditionChord(custom.root, custom.quality);
        refresh();
        return;
      }
      const k = e.target.closest('[data-pick-quality]');
      if (k) {
        custom.quality = k.dataset.pickQuality;
        player.auditionChord(custom.root, custom.quality);
        refresh();
      }
    });
    sevensBox.addEventListener('change', () => {
      sevenths = sevensBox.checked;
      refresh();
    });

    // ---- chip interactions ------------------------------------------------------------------------------
    function templateOf(chipEl) {
      if (chipEl.dataset.mod) return { kind: 'mod', modKind: chipEl.dataset.mod };
      if (chipEl.dataset.meter) return Object.assign({ kind: 'meter' }, JSON.parse(chipEl.dataset.meter));
      return { kind: 'chord', root: Number(chipEl.dataset.root), quality: chipEl.dataset.quality };
    }

    body.addEventListener('pointerdown', (e) => {
      const c = e.target.closest('.cc-chip');
      if (!c || e.button !== 0) return;
      const tmpl = templateOf(c);
      const sx = e.clientX;
      const sy = e.clientY;
      const pid = e.pointerId;
      const cleanup = () => {
        doc.removeEventListener('pointermove', move, true);
        doc.removeEventListener('pointerup', up, true);
        doc.removeEventListener('pointercancel', cleanup, true);
      };
      const move = (ev) => {
        if (ev.pointerId !== pid) return;
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < DRAG_THRESHOLD) return;
        cleanup();
        c.blur();
        timelineUI.beginPaletteDrag(ev, tmpl);
      };
      const up = (ev) => {
        if (ev.pointerId !== pid) return;
        cleanup();
        if (tmpl.kind === 'chord') player.auditionChord(tmpl.root, tmpl.quality);
      };
      doc.addEventListener('pointermove', move, true);
      doc.addEventListener('pointerup', up, true);
      doc.addEventListener('pointercancel', cleanup, true);
    });

    function appendToEnd(tmpl) {
      const end = timeline.songEndTick(store.getChords());
      if (tmpl.kind === 'mod') {
        // over the last chord (or the first measure on an empty song); else at the first free spot after it
        const last = timeline.sortChords(store.getChords()).pop();
        const L0 = timelineUI.measureLayout();
        const len = last ? last.lengthTicks : L0 ? L0.measures[0].lengthTicks : 16;
        if (!store.addMod({ kind: tmpl.modKind, lengthTicks: len }, last ? last.startTick : 0)) store.addMod({ kind: tmpl.modKind, lengthTicks: len }, end);
        return;
      }
      if (tmpl.kind === 'meter') {
        const measures = meterLib.buildMeasures(store.getMeters(), end + 1);
        const next = measures.find((m) => m.startTick >= end);
        store.addMeter(tmpl, Math.max(1, next ? next.index : measures.length));
        return;
      }
      const L = timelineUI.measureLayout();
      const length = L ? L.measureAtTick(end).lengthTicks : 16;
      const id = store.addChord({ root: tmpl.root, quality: tmpl.quality, lengthTicks: length }, end);
      if (id) player.auditionChord(tmpl.root, tmpl.quality);

      const c = e.target.closest('.cc-chip');
      if (c) appendToEnd(templateOf(c));
    });

      if (e.key === 'Enter') {
        e.preventDefault();
        appendToEnd(templateOf(c));
      }
      // (Space is play/pause everywhere; click a chip to hear it)
    });

    refresh();
    return { refresh };
  }

  const api = { create };
  NS.uiPalette = api;
  if (typeof module === 'object' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* app.js — assembles the app: toolbar, palette, timeline, player, keyboard shortcuts.
 * Embedding: ChordComposer.mount(element, options) returns { store, player, destroy }.
 * The standalone page auto-mounts into <div id="chord-composer">. */
(function (global) {
  'use strict';
  const NS = (global.ChordComposerModules = global.ChordComposerModules || {});

  const TEMPLATE =
    '<header class="cc-toolbar">' +
    '  <div class="cc-brand"><span class="cc-brand-mark" aria-hidden="true">♪</span> Chord Composer</div>' +
    '  <div class="cc-group cc-transport">' +
    '    <button type="button" class="cc-btn cc-btn-primary cc-btn-play" data-act="play" aria-label="Play" title="Play / pause (Space)">▶</button>' +
    '    <button type="button" class="cc-btn" data-act="stop" aria-label="Stop" title="Stop">■</button>' +
    '    <button type="button" class="cc-btn cc-toggle" data-act="loop" aria-pressed="true" title="Loop playback">⟲ Loop</button>' +
    '  </div>' +
    '  <label class="cc-group cc-slider"><span>Tempo</span><input type="range" min="40" max="160" step="1" data-role="bpm" aria-label="Tempo in beats per minute"><output data-role="bpm-out"></output></label>' +
    '  <label class="cc-group cc-slider"><span>Volume</span><input type="range" min="0" max="100" step="1" data-role="volume" aria-label="Volume"></label>' +
    '  <div class="cc-group"><span>Key</span><select data-role="key-root" aria-label="Key"></select><select data-role="key-mode" aria-label="Mode"><option value="major">major</option><option value="minor">minor</option></select></div>' +
    '  <label class="cc-group"><span>Template</span><select data-role="template" aria-label="Start from a well-known chord progression"><option value="">Choose a progression…</option></select></label>' +
    '  <div class="cc-group cc-right">' +
    '    <button type="button" class="cc-btn" data-act="undo" aria-label="Undo" title="Undo (Ctrl/Cmd+Z)">↶</button>' +
    '    <button type="button" class="cc-btn" data-act="redo" aria-label="Redo" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button>' +
    '    <button type="button" class="cc-btn" data-act="reroll" title="Compose a different melody for the same chords">⟳ Re-roll</button>' +
    '    <button type="button" class="cc-btn" data-act="clear" title="Remove all chords and time signatures">Clear</button>' +
    '    <button type="button" class="cc-btn" data-act="export-midi" title="Download the music as a MIDI file">⇩ MIDI</button>' +
    '    <button type="button" class="cc-btn" data-act="export-png" title="Download the sheet music as a PNG image">⇩ PNG</button>' +
    '  </div>' +
    '</header>' +
    '<section class="cc-panel cc-palette" data-role="palette" aria-label="Chord palette"></section>' +
    '<section class="cc-panel cc-timeline-panel" data-role="timeline" aria-label="Music bar"></section>' +
    '<footer class="cc-help">' +
    '  <span data-role="status" role="status" aria-live="polite"></span>' +
    '  <span class="cc-help-keys">Drag chords to the bar · right edge resizes · drag away to remove · double-click to edit · click the staff to drop a note, drag notes up/down (Shift = free) or sideways · <kbd>Space</kbd> play/pause · <kbd>⌫</kbd> stop &amp; rewind · <kbd>←</kbd> last click · <kbd>→</kbd> end</span>' +
    '</footer>';

  function mount(rootEl, options) {
    const opts = options || {};
    rootEl.classList.add('cc-app');
    rootEl.innerHTML = TEMPLATE;
    rootEl.tabIndex = -1;

    const theory = NS.theory;
    const timeline = NS.timeline;
    const store = NS.store.create(opts.store);
    const q = (sel) => rootEl.querySelector(sel);
    const status = q('[data-role="status"]');

    const player = NS.player.create({
      getNotes: () => store.getNotes(),
      getEndBeat: () => store.getEndBeat(),
      getBpm: () => store.state.bpm,
      isLoop: () => store.state.loop,
      onEnded: () => {
        ensureLoop();
      },
    });
    player.setVolume(store.state.volume);

    const tl = NS.uiTimeline.create(q('[data-role="timeline"]'), store, player);
    const palette = NS.uiPalette.create(q('[data-role="palette"]'), store, player, tl);
    let anchorBeat = 0; // the last place the user clicked in the bars (Left arrow returns here)
    tl.onSeek = (beat) => {
      anchorBeat = beat;
      player.unlock();
      player.seek(beat);
      ensureLoop();
    };
    tl.onAnchor = (beat) => {
      anchorBeat = beat;
      if (!player.isPlaying()) {
        player.seek(beat); // show the playhead there; while playing, playback carries on undisturbed
        ensureLoop();
      }
    };

    // ---- toolbar -----------------------------------------------------------------------------------
    const bpm = q('[data-role="bpm"]');
    const bpmOut = q('[data-role="bpm-out"]');
    const vol = q('[data-role="volume"]');
    const keyRoot = q('[data-role="key-root"]');
    const keyMode = q('[data-role="key-mode"]');
    const btn = (act) => q('[data-act="' + act + '"]');
    const playBtn = btn('play');

    function fillKeyOptions() {
      const sharps = theory.keyUsesSharps(store.state.key.root, store.state.key.mode);
      keyRoot.textContent = '';
      for (let i = 0; i < 12; i++) {
        const o = document.createElement('option');
        o.value = String(i);
        o.textContent = theory.noteName(i, sharps);
        keyRoot.appendChild(o);
      }
      keyRoot.value = String(store.state.key.root);
    }

    function say(msg) {
      status.textContent = msg || '';
      if (msg) {
        clearTimeout(say.t);
        say.t = setTimeout(() => (status.textContent = ''), 3500);
      }
    }

    function syncToolbar() {
      bpm.value = String(store.state.bpm);
      bpmOut.textContent = store.state.bpm + ' bpm';
      vol.value = String(Math.round(store.state.volume * 100));
      const loop = btn('loop');
      loop.setAttribute('aria-pressed', store.state.loop ? 'true' : 'false');
      loop.classList.toggle('is-on', store.state.loop);
      btn('undo').disabled = !store.canUndo();
      btn('redo').disabled = !store.canRedo();
      btn('clear').disabled = store.getChords().length === 0;
      btn('reroll').disabled = store.getChords().length === 0;
      btn('export-midi').disabled = btn('export-png').disabled = store.getChords().length === 0;
      keyMode.value = store.state.key.mode;
      fillKeyOptions();
    }

    bpm.addEventListener('input', () => store.setBpm(Number(bpm.value)));
    vol.addEventListener('input', () => {
      store.setVolume(Number(vol.value) / 100);
      player.setVolume(store.state.volume);
    });
    keyRoot.addEventListener('change', () => store.setKey(Number(keyRoot.value), store.state.key.mode));
    keyMode.addEventListener('change', () => store.setKey(store.state.key.root, keyMode.value));

    // progression templates: replace the chords with a well-known progression in the current key
    const tplSelect = q('[data-role="template"]');
    ['major', 'minor'].forEach((mode) => {
      const og = document.createElement('optgroup');
      og.label = mode === 'major' ? 'Major' : 'Minor';
      NS.templates.list.filter((t) => t.mode === mode).forEach((t) => {
        const o = document.createElement('option');
        o.value = t.id;
        o.textContent = t.name;
        og.appendChild(o);
      });
      tplSelect.appendChild(og);
    });
    tplSelect.addEventListener('change', () => {
      if (!tplSelect.value) return;
      player.unlock();
      store.applyTemplate(tplSelect.value);
      tplSelect.value = '';
      say('Template applied — undo with Ctrl/Cmd+Z');
    });

    function togglePlay() {
      if (player.isPlaying()) {
        player.pause();
      } else if (!player.play()) {
        say(player.supported() ? 'Add a chord to the music bar first.' : 'Audio is not supported in this browser.');
      } else {
        player.warm(store.getNotes().map((n) => n.midi));
      }
      ensureLoop();
    }

    rootEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      switch (b.dataset.act) {
        case 'play':
          togglePlay();
          break;
        case 'stop':
          player.stop();
          ensureLoop();
          break;
        case 'loop':
          store.setLoop(!store.state.loop);
          break;
        case 'undo':
          store.undo();
          break;
        case 'redo':
          store.redo();
          break;
        case 'reroll':
          player.unlock();
          store.reroll();
          break;
        case 'export-midi':
          if (store.getNotes().length) NS.exporter.midi(store);
          break;
        case 'export-png':
          NS.exporter.png(tl.getSvg()).then((ok) => say(ok ? 'Sheet music saved as a PNG' : 'Could not create the PNG in this browser'));
          break;
        case 'clear':
          store.clear();
          break;
        default:
      }
    });

    // ---- keyboard ----------------------------------------------------------------------------------
    function onKey(e) {
      if (e.defaultPrevented) return;
      const t = e.target;
      const tag = t && t.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      // only react when focus is inside the app (or nowhere), so embedding apps keep their own shortcuts
      const active = document.activeElement;
      if (active && active !== document.body && !rootEl.contains(active)) return;

      const mod = e.metaKey || e.ctrlKey;
      if (mod && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        if (e.shiftKey) store.redo();
        else store.undo();
        return;
      }
      if (mod && (e.key === 'y' || e.key === 'Y')) {
        e.preventDefault();
        store.redo();
        return;
      }
      if (mod) return;

      const sel = store.getSelectedId();
      const chord = sel && store.getChords().find((c) => c.id === sel);
      const overlayMod = sel && store.getMods().find((m) => m.id === sel);
      switch (e.key) {
        case ' ': // play / pause from anywhere (a focused button doesn't also click)
          e.preventDefault();
          togglePlay();
          break;
        case 'Backspace': // stop and go back to the start
          e.preventDefault();
          player.unlock();
          player.stop();
          tl.scrollToStart();
          ensureLoop();
          say('Stopped — back at the start');
          break;
        case 'Escape':
          if (tl.isPopoverOpen()) tl.closePopover();
          else store.select(null);
          break;
        case 'Delete':
          if (chord) {
            e.preventDefault();
            store.removeChord(sel);
          } else if (overlayMod) {
            e.preventDefault();
            store.removeMod(sel);
          }
          break;
        case 'ArrowLeft':
        case 'ArrowRight': {
          const dir = e.key === 'ArrowRight' ? 1 : -1;
          if (chord && (e.altKey || e.shiftKey)) {
            // Alt+arrows move the selected chord (swapping with a neighbour), Shift+arrows resize it
            e.preventDefault();
            const pulse = tl.pulseAtTick(chord.startTick); // one beat of the meter the chord sits in
            if (e.shiftKey) {
              if (chord.lengthTicks + dir * pulse >= pulse) store.resizeChord(sel, chord.lengthTicks + dir * pulse);
            } else store.shiftChord(sel, dir * pulse);
          } else if (!e.altKey && !e.shiftKey) {
            // Left: back to where you last clicked in the bars · Right: to the end
            e.preventDefault();
            player.unlock();
            player.seek(dir < 0 ? anchorBeat : store.getEndBeat());
            if (dir > 0) tl.revealBeat(store.getEndBeat());
            else tl.revealBeat(anchorBeat);
            ensureLoop();
          }
          break;
        }
        case 'Enter':
          if (chord && tag !== 'BUTTON') {
            e.preventDefault();
            tl.openPopover(sel);
          }
          break;
        default:
      }
    }
    document.addEventListener('keydown', onKey);
    // Space on a focused button would otherwise also "click" it when released
    const onKeyUp = (e) => {
      if (e.key !== ' ') return;
      const active = document.activeElement;
      if (active && rootEl.contains(active) && active.tagName === 'BUTTON') e.preventDefault();
    };
    document.addEventListener('keyup', onKeyUp);

    // ---- playback animation loop ---------------------------------------------------------------------
    let raf = 0;
    function frame() {
      raf = 0;
      const playing = player.isPlaying();
      playBtn.textContent = playing ? '❚❚' : '▶';
      playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      const beat = player.getPositionBeats();
      if (playing) {
        tl.setPlayhead(beat, true);
        const c = timeline.chordAtTick(store.getChords(), Math.floor(beat * theory.TICKS_PER_QUARTER));
        tl.setPlayingChord(c ? c.id : null);
        tl.setPlayingBeat(beat);
        raf = global.requestAnimationFrame(frame);
      } else {
        tl.setPlayhead(beat > 0 ? beat : null, false);
        tl.setPlayingChord(null);
        tl.setPlayingBeat(null);
      }
    }
    function ensureLoop() {
      if (!raf) raf = global.requestAnimationFrame(frame);
    }

    // ---- state -> UI -----------------------------------------------------------------------------------
    let lastPitchKey = '';
    function onChange() {
      syncToolbar();
      palette.refresh();
      tl.render();
      const pitches = Array.from(new Set(store.getNotes().map((n) => n.midi)));
      const key = pitches.join(',');
      if (key !== lastPitchKey) {
        lastPitchKey = key;
        player.warm(pitches);
      }
    }
    store.subscribe(onChange);
    onChange();
    ensureLoop();

    return {
      store,
      player,
      destroy() {
        player.stop();
        document.removeEventListener('keydown', onKey);
        document.removeEventListener('keyup', onKeyUp);
        if (raf) global.cancelAnimationFrame(raf);
        rootEl.textContent = '';
        rootEl.classList.remove('cc-app');
      },
    };
  }

  function autoMount() {
    const host = document.getElementById('chord-composer');
    if (host && !host.dataset.ccMounted) {
      host.dataset.ccMounted = '1';
      global.ChordComposer.instance = mount(host);
    }
  }

  global.ChordComposer = { mount, instance: null };
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', autoMount);
    else autoMount();
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
