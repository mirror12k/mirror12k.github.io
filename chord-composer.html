<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Chord Composer</title>
<style>html,body{margin:0;background:#25272b;color-scheme:dark}</style>
<style>
/* Chord Composer — dark, low-contrast, gentle gray. Everything is scoped under .cc-app so the
   single-file build can be inlined into other pages without leaking styles. */

.cc-app {
  --cc-bg: #25272b;
  --cc-panel: #2d3035;
  --cc-raised: #363a40;
  --cc-raised-hover: #3d4147;
  --cc-line: #40444b;
  --cc-text: #d5d8de;
  --cc-muted: #9097a1;
  --cc-accent: #7fb3c4;
  --cc-accent-soft: rgba(127, 179, 196, 0.18);
  --cc-playhead: #d9b77a;
  --cc-danger: #c98a8a;
  --cc-grid-bar: rgba(255, 255, 255, 0.10);
  --cc-grid-beat: rgba(255, 255, 255, 0.04);
  --cc-grid-guide: rgba(255, 255, 255, 0.05);
  --cc-radius: 10px;
  --bar-w: 168px;

  box-sizing: border-box;
  min-height: 100vh;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  background: var(--cc-bg);
  color: var(--cc-text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
  -webkit-font-smoothing: antialiased;
}
.cc-app *, .cc-app *::before, .cc-app *::after { box-sizing: border-box; }
.cc-app [hidden] { display: none !important; }
.cc-app:focus { outline: none; }

/* ---------- controls ---------- */
.cc-app button, .cc-app select, .cc-app input { font: inherit; color: inherit; }
.cc-app :focus-visible { outline: 2px solid var(--cc-accent); outline-offset: 2px; }

.cc-btn {
  appearance: none;
  border: 1px solid var(--cc-line);
  background: var(--cc-raised);
  border-radius: 8px;
  padding: 6px 12px;
  min-height: 34px;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
}
.cc-btn:hover:not(:disabled) { background: var(--cc-raised-hover); }
.cc-btn:disabled { opacity: 0.4; cursor: default; }
.cc-btn-sm { padding: 3px 10px; min-height: 28px; }
.cc-btn-primary { background: #3b5560; border-color: #4f6e7b; color: #e6eef1; }
.cc-btn-primary:hover:not(:disabled) { background: #43616d; }
.cc-btn-play { min-width: 46px; font-size: 15px; }
.cc-toggle.is-on { background: var(--cc-accent-soft); border-color: #55808f; color: #cfe3ea; }
.cc-danger { color: var(--cc-danger); }

.cc-app select {
  appearance: none;
  background: var(--cc-raised) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%239097a1' stroke-width='1.5'/></svg>") no-repeat right 9px center;
  border: 1px solid var(--cc-line);
  border-radius: 8px;
  padding: 5px 26px 5px 10px;
  min-height: 32px;
  cursor: pointer;
}
.cc-app input[type="range"] {
  appearance: none;
  height: 4px;
  width: 110px;
  border-radius: 2px;
  background: var(--cc-line);
  cursor: pointer;
}
.cc-app input[type="range"]::-webkit-slider-thumb {
  appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--cc-accent); border: 0;
}
.cc-app input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%; background: var(--cc-accent); border: 0;
}

/* ---------- toolbar ---------- */
.cc-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px 14px;
  background: var(--cc-panel);
  border-bottom: 1px solid var(--cc-line);
}
.cc-brand { font-weight: 600; letter-spacing: 0.02em; color: #e1e4e9; margin-right: 6px; white-space: nowrap; }
.cc-brand-mark { color: var(--cc-accent); }
.cc-group { display: flex; align-items: center; gap: 8px; color: var(--cc-muted); }
.cc-group > span:first-child { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.cc-group output { min-width: 56px; color: var(--cc-text); font-variant-numeric: tabular-nums; }
.cc-right { margin-left: auto; }

/* ---------- panels ---------- */
.cc-panel {
  background: var(--cc-panel);
  border-bottom: 1px solid var(--cc-line);
}

/* ---------- palette ---------- */
.cc-palette { padding: 12px 14px 14px; }
.cc-pal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px; }
.cc-tabs { display: inline-flex; background: var(--cc-bg); border-radius: 8px; padding: 3px; gap: 2px; }
.cc-tab {
  appearance: none; border: 0; background: transparent; color: var(--cc-muted);
  padding: 5px 14px; border-radius: 6px; cursor: pointer;
}
.cc-tab.is-active { background: var(--cc-raised); color: var(--cc-text); }
.cc-check { display: inline-flex; align-items: center; gap: 6px; color: var(--cc-muted); cursor: pointer; user-select: none; }
.cc-check input { accent-color: var(--cc-accent); }
.cc-pal-hint { margin-left: auto; color: var(--cc-muted); font-size: 12px; }

.cc-chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
.cc-chip {
  appearance: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-width: 92px; height: 66px; padding: 6px 12px;
  background: hsl(var(--h) 24% 29%);
  border: 1px solid hsl(var(--h) 34% 46%);
  border-radius: 10px;
  color: hsl(var(--h) 30% 90%);
  cursor: grab;
  touch-action: none;
  user-select: none; -webkit-user-select: none;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);
  transition: transform 0.12s ease, background 0.15s ease;
}
.cc-chip:hover { background: hsl(var(--h) 26% 33%); transform: translateY(-1px); }
.cc-chip:active { cursor: grabbing; }
.cc-chip-name { font-size: 20px; font-weight: 600; }
.cc-chip-sub { font-size: 11px; color: hsl(var(--h) 20% 72%); }

.cc-custom { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
.cc-pick { display: flex; flex-wrap: wrap; gap: 6px; max-width: 460px; }
.cc-pill {
  appearance: none; border: 1px solid var(--cc-line); background: var(--cc-raised);
  color: var(--cc-text); padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 13px;
}
.cc-pill:hover { background: var(--cc-raised-hover); }
.cc-pill.is-active { background: var(--cc-accent-soft); border-color: #55808f; color: #d3e6ec; }

/* ---------- timeline ---------- */
.cc-timeline-panel { position: relative; padding: 0; overflow: visible; }
.cc-tl-scroll { overflow-x: auto; overflow-y: hidden; scrollbar-color: #4a4f57 transparent; }
.cc-tl-inner { position: relative; min-width: 100%; }

.cc-ruler {
  position: relative; height: 46px; cursor: pointer; z-index: 2;
  background: var(--cc-panel);
  border-bottom: 1px solid var(--cc-line);
}
.cc-ruler-cell {
  position: absolute; bottom: 0; height: 26px;
  border-left: 1px solid var(--cc-grid-bar);
  background-image: repeating-linear-gradient(to right, var(--cc-grid-beat) 0 1px, transparent 1px var(--pulse, 56px));
  padding: 5px 0 0 7px; color: var(--cc-muted); font-size: 12px; font-variant-numeric: tabular-nums;
}

/* time-signature blocks sit in the ruler, at the bar line where the new meter starts */
.cc-sig {
  position: absolute; top: 5px; width: 50px; height: 36px; z-index: 3;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  background: #403c36; border: 1px solid #6d6050; border-radius: 7px; color: #ebdcc0;
  font: 700 15px/1 Georgia, "Times New Roman", serif;
  cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
  transition: background 0.15s ease;
}
.cc-sig:hover { background: #4a453d; }
.cc-sig.is-initial { cursor: pointer; background: #373a3f; border-color: #565b63; color: #d5d8de; }
.cc-sig.is-initial:hover { background: #3f4349; }
.cc-sig-num, .cc-sig-den { display: block; }
.cc-sig-den { margin-top: 1px; }
.cc-sig-clone { width: 50px; height: 36px; padding: 0; opacity: 0.95; }
.cc-sig-clone.is-removing { opacity: 0.5; border-style: dashed; border-color: var(--cc-danger); }
.cc-sig-clone.is-removing::after { content: none; }

.cc-gap-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.cc-sig-gap {
  position: absolute; top: 46px; bottom: 0;
  background: rgba(217, 183, 122, 0.045);
  border-left: 1px dashed rgba(217, 183, 122, 0.25);
}

.cc-track {
  position: relative; height: 54px;
  background-color: rgba(0, 0, 0, 0.10);
  border-bottom: 1px solid var(--cc-line);
}
.cc-grid { position: absolute; inset: 0; pointer-events: none; }
.cc-cell {
  position: absolute; top: 0; bottom: 0;
  border-left: 1px solid var(--cc-grid-bar);
  background-image: repeating-linear-gradient(to right, var(--cc-grid-beat) 0 1px, transparent 1px var(--pulse, 56px));
}
.cc-empty-hint {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--cc-muted); pointer-events: none; font-size: 15px;
}
.is-dragging .cc-track { background-color: rgba(127, 179, 196, 0.06); }

/* engraved melody */
.cc-notation { position: relative; min-height: 140px; background: rgba(0, 0, 0, 0.07); --cc-ink: #d5d8de; }
.cc-notation svg { display: block; }
.cc-nt { transition: opacity 0.1s ease; }
.cc-nt.is-playing .cc-nh { fill: #f6e2b3; }
.cc-nt.is-playing .cc-ns { stroke: #f6e2b3; }
.cc-nt.is-playing { filter: drop-shadow(0 0 5px rgba(246, 226, 179, 0.7)); }

.cc-playhead {
  position: absolute; top: 0; bottom: 0; left: 0; width: 2px; margin-left: -1px;
  background: var(--cc-playhead); opacity: 0.85; pointer-events: none; z-index: 5;
  box-shadow: 0 0 8px rgba(217, 183, 122, 0.4);
  will-change: transform;
}

/* ---------- chord blocks ---------- */
.cc-block {
  position: absolute; top: 5px; height: 44px;
  display: flex; flex-direction: column; justify-content: center; gap: 1px;
  padding: 3px 18px 3px 10px;
  background: hsl(var(--h) 24% 29%);
  border: 1px solid hsl(var(--h) 34% 46%);
  border-radius: 10px;
  color: hsl(var(--h) 30% 90%);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  cursor: grab;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
  overflow: hidden;
  transition: background 0.15s ease, box-shadow 0.15s ease, left 0.15s ease, width 0.15s ease;
}
.cc-block:hover { background: hsl(var(--h) 26% 32%); }
.cc-block.is-selected { outline: 2px solid var(--cc-accent); outline-offset: 1px; }
.cc-block.is-playing {
  background: hsl(var(--h) 30% 38%);
  box-shadow: 0 0 16px hsla(var(--h), 50%, 60%, 0.35);
}
.cc-block.is-ghost { opacity: 0.55; border-style: dashed; }
.cc-block-name { font-size: 17px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
.cc-block-sub { font-size: 10.5px; color: hsl(var(--h) 20% 74%); white-space: nowrap; line-height: 1.2; }
.cc-block-badge { display: none; }

.cc-handle {
  position: absolute; top: 0; right: 0; bottom: 0; width: 16px;
  cursor: ew-resize;
  background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.05));
  touch-action: none;
}
.cc-handle::before, .cc-handle::after {
  content: ""; position: absolute; top: 50%; width: 2px; height: 22px; margin-top: -11px;
  background: hsl(var(--h) 25% 62%); opacity: 0.35; border-radius: 1px; transition: opacity 0.15s ease;
}
.cc-handle::before { left: 4px; }
.cc-handle::after { left: 9px; }
.cc-block:hover .cc-handle::before, .cc-block:hover .cc-handle::after,
.cc-block.is-selected .cc-handle::before, .cc-block.is-selected .cc-handle::after { opacity: 0.85; }

/* chord being dragged (follows the pointer) */
.cc-drag-clone {
  position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none;
  opacity: 0.92; cursor: grabbing;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
  transition: none; padding-right: 12px;
}
.cc-drag-clone.is-removing { opacity: 0.5; border-style: dashed; border-color: var(--cc-danger); }
.cc-drag-clone.is-removing::after {
  content: "release to remove"; position: absolute; left: 12px; bottom: 6px; font-size: 11px; color: var(--cc-danger);
}
.cc-drag-clone.is-invalid { opacity: 0.45; }
.is-dragging-chord, .is-dragging-chord * { cursor: grabbing !important; }

/* ---------- popover ---------- */
.cc-popover {
  position: absolute; z-index: 20; min-width: 290px;
  background: var(--cc-raised); border: 1px solid #4b5058; border-radius: 12px;
  padding: 12px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
}
.cc-pop-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cc-pop-row label { display: flex; align-items: center; gap: 6px; color: var(--cc-muted); font-size: 12px; }
.cc-pop-label { color: var(--cc-muted); font-size: 12px; }
.cc-pop-row output { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
.cc-pop-notes { color: var(--cc-muted); font-size: 12px; }
.cc-pop-actions { justify-content: flex-end; }
.cc-popover .cc-btn { background: var(--cc-panel); }
.cc-popover .cc-btn-primary { background: #3b5560; }
.cc-popover select { background-color: var(--cc-panel); }

/* short chords: compact blocks */
.cc-block.is-narrow { padding: 6px 12px 6px 7px; }
.cc-block.is-narrow .cc-block-name { font-size: 16px; }
.cc-block.is-narrow .cc-block-sub { display: none; }
.cc-block.is-narrow .cc-block-badge { font-size: 10px; }
.cc-block.is-narrow .cc-handle { width: 10px; }
.cc-block.is-narrow .cc-handle::before { left: 2px; }
.cc-block.is-narrow .cc-handle::after { left: 6px; }
.cc-block.is-tiny { padding: 6px 9px 6px 3px; }
.cc-block.is-tiny .cc-block-name { font-size: 13px; overflow: hidden; text-overflow: clip; }
.cc-block.is-tiny .cc-block-badge { display: none; }

/* inputs (meter builder + popover) */
.cc-app input[type="number"], .cc-app input[type="text"] {
  background: var(--cc-bg); border: 1px solid var(--cc-line); border-radius: 8px;
  padding: 5px 8px; min-height: 32px; width: 5.5em;
}
.cc-app input[type="text"] { width: 9em; }
.cc-app input.is-invalid { border-color: var(--cc-danger); }
.cc-pop-hint { color: var(--cc-muted); font-size: 12px; max-width: 280px; }
.cc-meter-builder { gap: 10px 18px; }
.cc-meter-builder label { display: flex; align-items: center; gap: 6px; color: var(--cc-muted); font-size: 12px; }
.cc-chip-meter { min-width: 80px; }
.cc-chip-meter .cc-chip-name { font: 700 22px/1.1 Georgia, "Times New Roman", serif; }
.cc-chip-meter { background: #403c36; border-color: #6d6050; color: #ebdcc0; }
.cc-chip-meter:hover { background: #4a453d; }
.cc-chip-meter .cc-chip-sub { color: #b3a58b; }

/* ---------- footer ---------- */
.cc-help {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px;
  padding: 8px 14px; color: var(--cc-muted); font-size: 12px;
}
.cc-help [role="status"] { color: var(--cc-playhead); min-height: 1.4em; }

@media (max-width: 720px) {
  .cc-right { margin-left: 0; }
  .cc-pal-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cc-app * { transition: none !important; }
}

/* ---------- overlay modifiers (staccato / slur / fades), two lanes above the notation ---------- */
.cc-mods { border-bottom: 1px solid var(--cc-line); background: rgba(0, 0, 0, 0.05); }
.cc-mod-lane { position: relative; height: 24px; }
.cc-mod-lane + .cc-mod-lane { border-top: 1px dashed rgba(255, 255, 255, 0.06); }
.cc-lane-label {
  position: sticky; left: 8px; display: inline-block; padding: 0 8px; margin-top: 5px;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cc-muted); opacity: 0.55;
  pointer-events: none;
}
.is-dragging .cc-mod-lane { background-color: rgba(127, 179, 196, 0.05); }
.cc-mod {
  position: absolute; top: 2px; height: 20px; box-sizing: border-box;
  display: flex; align-items: center; gap: 6px; padding: 0 16px 0 8px;
  background: hsl(var(--h) 26% 28%);
  border: 1px solid hsl(var(--h) 36% 48%);
  border-radius: 6px;
  color: hsl(var(--h) 30% 88%);
  font-size: 11.5px; line-height: 1; white-space: nowrap;
  cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; overflow: hidden;
}
.cc-mod:hover { background: hsl(var(--h) 28% 32%); }
.cc-mod.is-selected { outline: 2px solid var(--cc-accent); outline-offset: 1px; }
.cc-mod.is-ghost { opacity: 0.55; border-style: dashed; }
.cc-mod-glyph { font-weight: 700; font-size: 13px; min-width: 10px; text-align: center; }
.cc-mod .cc-handle { width: 12px; }
.cc-mod .cc-handle::before, .cc-mod .cc-handle::after { height: 10px; margin-top: -5px; }
.cc-mod .cc-handle::before { left: 2px; }
.cc-mod .cc-handle::after { left: 6px; }
.cc-mod.is-tiny .cc-mod-name { display: none; }
.cc-mod.cc-drag-clone { height: 20px; }
.cc-chip-mod { min-width: 120px; }

/* ---------- editing notes on the notation ---------- */
.cc-notation { cursor: cell; }
.cc-nt-svg { position: relative; }
.cc-edit-layer { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 4; }
.cc-hit { cursor: grab; }
.cc-hit:hover { fill: rgba(127, 179, 196, 0.22); }
.is-note-dragging, .is-note-dragging * { cursor: grabbing !important; }
.cc-help kbd {
  font: inherit; font-size: 11px; padding: 0 5px; border: 1px solid var(--cc-line); border-bottom-width: 2px;
  border-radius: 4px; background: rgba(255, 255, 255, 0.04);
}
</style>
</head>
<body>
<div id="chord-composer"></div>
<script>
/* theory.js — pure music-theory helpers (no DOM, no audio). */
(function (global) {
  'use strict';
  const NS = (global.ChordComposerModules = global.ChordComposerModules || {});

  // The timeline grid is measured in TICKS: one tick = one sixteenth note, so a quarter note = 4 ticks.
  const TICKS_PER_QUARTER = 4;

  // How a chord is voiced by the composer, and its register (octave of the middle of its range; 4 = A4 region).
  const CHORD_MODES = {
    arp: { label: 'Arpeggio', short: 'arp' },
    chord: { label: 'Full chord (held)', short: 'chord' },
    repeat: { label: 'Repeat one note', short: 'repeat' },
    pairs: { label: 'Pairs (two notes)', short: 'pairs' },
  };
  const MODE_ORDER = ['arp', 'chord', 'repeat', 'pairs'];
  const DEFAULT_OCTAVE = 4;
  const MIN_OCTAVE = 2;
  const MAX_OCTAVE = 6;

  const FLAT_NAMES = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
  const SHARP_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];

  // intervals in semitones above the root; `label` is the suffix shown after the root name.
  const QUALITIES = {
    maj: { intervals: [0, 4, 7], label: '', long: 'major' },
    min: { intervals: [0, 3, 7], label: 'm', long: 'minor' },
    dim: { intervals: [0, 3, 6], label: '°', long: 'diminished' },
    aug: { intervals: [0, 4, 8], label: '+', long: 'augmented' },
    sus2: { intervals: [0, 2, 7], label: 'sus2', long: 'suspended 2nd' },
    sus4: { intervals: [0, 5, 7], label: 'sus4', long: 'suspended 4th' },
    6: { intervals: [0, 4, 7, 9], label: '6', long: 'major 6th' },
    7: { intervals: [0, 4, 7, 10], label: '7', long: 'dominant 7th' },
    maj7: { intervals: [0, 4, 7, 11], label: 'maj7', long: 'major 7th' },
    m7: { intervals: [0, 3, 7, 10], label: 'm7', long: 'minor 7th' },
    m7b5: { intervals: [0, 3, 6, 10], label: 'm7♭5', long: 'half-diminished' },
    dim7: { intervals: [0, 3, 6, 9], label: '°7', long: 'diminished 7th' },
  };
  const QUALITY_ORDER = ['maj', 'min', 'dim', 'aug', 'sus2', 'sus4', '6', '7', 'maj7', 'm7', 'm7b5', 'dim7'];

  const MODES = {
    major: {
      scale: [0, 2, 4, 5, 7, 9, 11],
      triads: ['maj', 'min', 'min', 'maj', 'maj', 'min', 'dim'],
      sevenths: ['maj7', 'm7', 'm7', 'maj7', '7', 'm7', 'm7b5'],
    },
    minor: {
      scale: [0, 2, 3, 5, 7, 8, 10],
      triads: ['min', 'dim', 'maj', 'min', 'min', 'maj', 'maj'],
      sevenths: ['m7', 'm7b5', 'maj7', 'm7', 'm7', 'maj7', '7'],
    },
  };
  const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];

  const mod12 = (n) => ((n % 12) + 12) % 12;

  /** Should this key be spelled with sharps (otherwise flats)? */
  function keyUsesSharps(root, mode) {
    const majorRoot = mode === 'minor' ? mod12(root + 3) : mod12(root);
    return [7, 2, 9, 4, 11].indexOf(majorRoot) !== -1; // G D A E B major (F♯ spelled with flats: G♭)
  }

<script>
/* notation.js — engraves the composed notes as standard music notation (pure: returns an SVG string).
 * Treble staff (it grows taller for extreme octaves), key signature, time signatures wherever a meter block
 * sits, bar lines at the real measure boundaries, whole/half/quarter/eighth/sixteenth notes (dotted and tied
 * as needed), stacked heads for held chords and pairs, beams per beat group, accidentals, ledger lines, rests.
 * Horizontal positions come from the shared timeline layout, so the notation lines up under the chords. */
(function (global) {
  'use strict';
  const NS = (global.ChordComposerModules = global.ChordComposerModules || {});
  const dep = (n) => NS[n] || (typeof require === 'function' ? require('./' + n + '.js') : null);
  const theory = dep('theory');

  const S = 9; // distance between staff lines
  const HALF = S / 2;
  const MIN_TOP = 36;
  const MIN_BOTTOM = 36;
  const STEM = 30;
  const CLEF_W = 40;
  const ACC_W = 8;
  const SIG_REGION = 56; // room for the initial time signature, at the right end of the gutter
  const BOTTOM_STEP = 30; // diatonic step of E4, the bottom line (octave*7 + letter, C=0)
  const MIDDLE_STEP = 34; // B4, the middle line: stems flip direction here

  const NATURAL_PC = [0, 2, 4, 5, 7, 9, 11];
  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  // semitone interval above the chord root -> letter distance (so E major spells G♯, not A♭)
  const LETTER_SHIFT = { 0: 0, 1: 1, 2: 1, 3: 2, 4: 2, 5: 3, 6: 4, 7: 4, 8: 4, 9: 5, 10: 6, 11: 6 };

  const SHARP_ORDER = [3, 0, 4, 1, 5, 2, 6]; // F C G D A E B
  const FLAT_ORDER = [6, 2, 5, 1, 4, 0, 3]; // B E A D G C F
  const SHARP_STEPS = [38, 35, 39, 36, 33, 37, 34]; // treble staff positions
  const FLAT_STEPS = [34, 37, 33, 36, 32, 35, 31];
  const KEY_COUNT = { 0: 0, 7: 1, 2: 2, 9: 3, 4: 4, 11: 5, 6: -6, 1: -5, 8: -4, 3: -3, 10: -2, 5: -1 };

  // durations in ticks (sixteenths) that have a written note value, largest first
  const STD = [16, 12, 8, 6, 4, 3, 2, 1];
  const TYPES = {
    16: { head: 'whole', stem: false, flags: 0, dots: 0 },
    12: { head: 'hollow', stem: true, flags: 0, dots: 1 },
    8: { head: 'hollow', stem: true, flags: 0, dots: 0 },
    6: { head: 'filled', stem: true, flags: 0, dots: 1 },
    4: { head: 'filled', stem: true, flags: 0, dots: 0 },
    3: { head: 'filled', stem: true, flags: 1, dots: 1 },
    2: { head: 'filled', stem: true, flags: 1, dots: 0 },
    1: { head: 'filled', stem: true, flags: 2, dots: 0 },
  };
  const REST_DURS = [16, 8, 4, 2, 1];

  const f = (n) => Math.round(n * 100) / 100;

  /** + sharps / - flats in the key signature (major root or relative major for minor keys). */
  function keySigCount(root, mode) {
    const majorRoot = mode === 'minor' ? theory.mod12(root + 3) : theory.mod12(root);
    return KEY_COUNT[majorRoot] || 0;
  }

  function gutterWidth(root, mode) {
    const n = Math.abs(keySigCount(root, mode));
    return CLEF_W + (n ? n * ACC_W + 8 : 0) + SIG_REGION;
  }

  const initialSigCenter = (gutter) => gutter - SIG_REGION / 2 - 1;

  /** Spell a MIDI pitch relative to the chord it belongs to: { letter 0-6, acc -2..2, octave, step }. */
  function spellNote(midi, chord, sharps) {
    const pc = theory.mod12(midi);
    const rootName = theory.noteName(chord.root, sharps);
    const rootLetter = LETTERS.indexOf(rootName[0]);
    const interval = theory.mod12(pc - chord.root);
    let shift = LETTER_SHIFT[interval];
    if (chord.quality === 'dim7' && interval === 9) shift = 6; // diminished 7th is spelled as a 7th
    const letter = (rootLetter + shift) % 7;
    let acc = pc - NATURAL_PC[letter];
    if (acc > 6) acc -= 12;
    if (acc < -6) acc += 12;
    const octave = Math.floor((midi - acc) / 12) - 1;
    return { letter, acc, octave, step: octave * 7 + letter };
  }

  // ---- glyphs (drawn as paths so no music font is required) ------------------------------------------

  function accidentalPath(acc, x, y) {
    const sharp = (cx) =>
      'M' + f(cx - 2.2) + ',' + f(y - 8) + 'V' + f(y + 9) + 'M' + f(cx + 2.2) + ',' + f(y - 9) + 'V' + f(y + 8) +
      'M' + f(cx - 4.4) + ',' + f(y - 1.3) + 'L' + f(cx + 4.4) + ',' + f(y - 4.3) +
      'M' + f(cx - 4.4) + ',' + f(y + 4.7) + 'L' + f(cx + 4.4) + ',' + f(y + 1.7);
    const flat = (cx) =>
      'M' + f(cx - 2.4) + ',' + f(y - 11) + 'V' + f(y + 3.5) +
      'C' + f(cx + 1.5) + ',' + f(y + 2.5) + ',' + f(cx + 5.2) + ',' + f(y - 0.5) + ',' + f(cx + 4.2) + ',' + f(y - 3.6) +
      'C' + f(cx + 3.2) + ',' + f(y - 6) + ',' + f(cx - 0.5) + ',' + f(y - 4.2) + ',' + f(cx - 2.4) + ',' + f(y - 2);
    const natural = (cx) =>
      'M' + f(cx - 2.4) + ',' + f(y - 9) + 'V' + f(y + 3) + 'L' + f(cx + 2.4) + ',' + f(y + 1.6) +
      'M' + f(cx + 2.4) + ',' + f(y + 9) + 'V' + f(y - 3) + 'L' + f(cx - 2.4) + ',' + f(y - 1.6);

    if (acc === 1) d = sharp(x);
    else if (acc === -1) d = flat(x);
    else if (acc === 0) d = natural(x);
    else if (acc === -2) d = flat(x - 4) + flat(x + 3);
    else d = 'M' + f(x - 4) + ',' + f(y - 4) + 'L' + f(x + 4) + ',' + f(y + 4) + 'M' + f(x + 4) + ',' + f(y - 4) + 'L' + f(x - 4) + ',' + f(y + 4);
    return '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
  }

  function trebleClef(x, gLineY) {
    const dy = gLineY - 27; // path is drawn with the G line at y=27
    return (
      '<g transform="translate(' + f(x) + ',' + f(dy) + ')" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M3,-14 C1.5,-6 1.2,6 0.6,18 S-1,34 -1.8,41 C-2.5,48 -8,50 -8,45.5 C-8,42.5 -4.5,42.5 -4.5,45"/>' +
      '<path d="M3,-14 C6,-12 8,-5 6,1 C4.5,5.5 -1,9 -5,13 C-10,18 -12,26 -8.5,31.5 C-5,37 4,37.5 8.5,32 C12,27 9,20 3,19.5 C-2,19 -3.5,24 -1,26.5 C0.5,28 3,27 2.5,25"/>' +
      '</g>'
    );
  }

  function timeSig(cx, m, top) {
    const font = 'font-family="Georgia, \'Times New Roman\', serif" font-size="25" font-weight="700" text-anchor="middle" fill="currentColor"';
    return (
      '<text x="' + f(cx) + '" y="' + f(top + 17) + '" ' + font + '>' + m.numerator + '</text>' +
      '<text x="' + f(cx) + '" y="' + f(top + 35) + '" ' + font + '>' + m.denominator + '</text>'

  function restGlyph(dur, cx, top) {
    const y = top + 2 * S;
    const ink = 'fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"';
    if (dur === 16) return '<rect x="' + f(cx - 7) + '" y="' + f(top + S) + '" width="14" height="4.5" fill="currentColor" opacity="0.8"/>';
    if (dur === 8) return '<rect x="' + f(cx - 7) + '" y="' + f(y - 4.5) + '" width="14" height="4.5" fill="currentColor" opacity="0.8"/>';
    if (dur === 4) {
      return (
        '<path d="M' + f(cx - 2.5) + ',' + f(y - 11) + 'L' + f(cx + 3) + ',' + f(y - 4.5) + 'L' + f(cx - 2.5) + ',' + f(y + 1.5) +
        'L' + f(cx + 2.5) + ',' + f(y + 7) + 'C' + f(cx - 2) + ',' + f(y + 6) + ',' + f(cx - 4) + ',' + f(y + 10) + ',' + f(cx - 1.5) + ',' + f(y + 12) +

      );

      '<circle cx="' + f(cx - 2.5) + '" cy="' + f(y - 4) + '" r="2.1" fill="currentColor" opacity="0.8"/>' +
      '<path d="M' + f(cx - 2.5) + ',' + f(y - 4) + 'C' + f(cx + 1) + ',' + f(y - 4) + ',' + f(cx + 2) + ',' + f(y - 6) + ',' + f(cx + 3) + ',' + f(y - 7) +
      'L' + f(cx - 1.5) + ',' + f(y + 9) + '" ' + ink + ' stroke-width="1.6"/>';
    if (dur === 1) g += '<circle cx="' + f(cx - 4.5) + '" cy="' + f(y + 2) + '" r="2.1" fill="currentColor" opacity="0.8"/>';

  }

  // ---- layout helpers -----------------------------------------------------------------------------

  /** Which beam group a tick belongs to: a beat in x/4, x/2, x/1 meters, a pattern group in x/8, x/16. */
  function beamKey(layout, tick) {
    const m = layout.measureAtTick(tick);
    const rel = tick - m.startTick;
    if (m.pulseTicks >= 4) return m.index + ':p' + Math.floor(rel / m.pulseTicks);
    let g = 0;
    for (const s of m.slots) if (rel >= s.rel && rel < s.rel + s.ticks) g = s.group;
    return m.index + ':g' + g;
  }

  function ledgerSteps(step) {
    const out = [];
    if (step < BOTTOM_STEP) for (let s = BOTTOM_STEP - 2; s >= step; s -= 2) out.push(s);
    if (step > BOTTOM_STEP + 8) for (let s = BOTTOM_STEP + 10; s <= step; s += 2) out.push(s);
    return out;
  }

  /** Split a note at measure lines, then into written note values. -> [{tick, dur}] */
  function splitPieces(layout, tick, dur) {
    // a triplet note (fractional ticks, e.g. 4/3) is written as the next-larger value under a "3": one piece
    if (Math.abs(dur - Math.round(dur)) > 1e-6) return [{ tick, dur, written: Math.round(dur * 1.5), tuplet: true }];
    const pieces = [];
    let t = tick;
    let remaining = dur;
    while (remaining > 0) {
      const m = layout.measureAtTick(t);
      let chunk = Math.min(remaining, Math.max(1, m.startTick + m.lengthTicks - t));
      remaining -= chunk;
      while (chunk > 0) {
        const d = STD.find((x) => x <= chunk);
        pieces.push({ tick: t, dur: d, written: d });
        t += d;
        chunk -= d;
      }

    return pieces;

  /**
   * render({ notes, chords, layout, key:{root,mode} }) -> { svg, height }
   * Each sounding event is wrapped in <g class="cc-nt" data-i="index of its first note">.
   */
  function render(opts) {
    const { notes, chords, layout } = opts;
    const key = opts.key || { root: 0, mode: 'major' };
    const mods = opts.mods || [];
    const sharps = theory.keyUsesSharps(key.root, key.mode);
    const width = Math.ceil(layout.totalWidth);
    const tickW = layout.opts.tickW;
    const sigW = layout.opts.sigW;
    const gutter = layout.opts.gutter;
    const chordById = {};
    chords.forEach((c) => (chordById[c.id] = c));
    const songEnd = chords.reduce((m, c) => Math.max(m, c.startTick + c.lengthTicks), 0);

    // spell every note, then size the staff to the register in use
    const entries = notes.map((n, i) => {
      const chord = chordById[n.chordId] || { root: theory.mod12(n.midi), quality: 'maj' };
      return { n, i, sp: spellNote(n.midi, chord, sharps), hue: theory.hueForRoot(chord.root) };
    });
    let minStep = BOTTOM_STEP;
    let maxStep = BOTTOM_STEP + 8;
    entries.forEach((e) => {
      minStep = Math.min(minStep, e.sp.step);
      maxStep = Math.max(maxStep, e.sp.step);
    });
    if (opts.reserve) {
      // room for the ghost notes shown while dragging a note a long way up or down
      minStep = Math.min(minStep, opts.reserve.minStep);
      maxStep = Math.max(maxStep, opts.reserve.maxStep);
    }
    const TOP = Math.max(MIN_TOP, (maxStep - (BOTTOM_STEP + 8)) * HALF + 20);
    const BOTTOM = Math.max(MIN_BOTTOM, (BOTTOM_STEP - minStep) * HALF + 20);

    // clef, key signature, initial time signature

    const kc = keySigCount(key.root, key.mode);
    for (let i = 0; i < Math.abs(kc); i++) {

      out.push(accidentalPath(kc > 0 ? 1 : -1, CLEF_W + 4 + i * ACC_W, stepY(step)));
    }
    out.push(timeSig(initialSigCenter(gutter), layout.measures[0].meter, TOP));

    // bar lines and meter changes
    const barY = 'M{x},' + f(TOP) + 'V' + f(TOP + 4 * S);
    layout.measures.forEach((m) => {

      out.push('<path d="' + barY.replace('{x}', f(bx)) + '" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.2"/>');

    if (songEnd > 0) {

      out.push('<path d="' + barY.replace('{x}', f(ex)) + '" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.2"/>');
      out.push('<path d="' + barY.replace('{x}', f(ex + 4)) + '" stroke="currentColor" stroke-opacity="0.9" stroke-width="3.2"/>');
    }

    // rests: ticks inside the song that no chord covers
    const covered = new Uint8Array(songEnd + 1);
    chords.forEach((c) => {
      for (let t = c.startTick; t < c.startTick + c.lengthTicks; t++) covered[t] = 1;
    });
    layout.measures.forEach((m) => {
      if (m.startTick >= songEnd) return;
      const mEnd = m.startTick + m.lengthTicks;
      const end = Math.min(mEnd, songEnd);
      let t = m.startTick;
      while (t < end) {
        if (covered[t]) {
          t++;
          continue;
        }
        const s = t;
        while (t < end && !covered[t]) t++;
        if (s === m.startTick && t === mEnd) {
          out.push(restGlyph(16, m.x + m.width / 2, TOP)); // whole-measure rest
          continue;
        }
        for (let u = s; u < t; ) {
          const rel = u - m.startTick;
          const d = REST_DURS.find((x) => x <= t - u && rel % x === 0) || 1;
          out.push(restGlyph(d, layout.xOfTick(u) + (d * tickW) / 2, TOP));
          u += d;
        }
      }
    });

    // ---- notes: group simultaneous notes into events, then into written pieces --------------------------
    const eventMap = new Map();
    entries.forEach((e) => {
      const k = e.n.tick + ':' + e.n.durTicks;
      let ev = eventMap.get(k);
      if (!ev) {
        ev = { tick: e.n.tick, dur: e.n.durTicks, items: [], first: e.i, hue: e.hue };
        eventMap.set(k, ev);
      }
      ev.items.push(e);
    });
    const pieces = [];
    Array.from(eventMap.values()).forEach((ev) => {
      ev.items.sort((a, b) => a.sp.step - b.sp.step || a.n.midi - b.n.midi);
      const meanStep = ev.items.reduce((s, it) => s + it.sp.step, 0) / ev.items.length;
      splitPieces(layout, ev.tick, ev.dur).forEach((p, idx, arr) => {
        pieces.push({ ev, tick: p.tick, dur: p.dur, tuplet: !!p.tuplet, type: TYPES[p.written] || TYPES[1], tiedFrom: idx > 0, prev: idx > 0 ? arr[idx - 1] : null, meanStep, x: layout.xOfTick(p.tick) + (p.dur * tickW) / 2 });
      });
    });
    pieces.sort((a, b) => a.tick - b.tick);
    pieces.forEach((p, i) => {
      p.i = i;
      p.ys = p.ev.items.map((it) => stepY(it.sp.step));
      p.minY = Math.min.apply(null, p.ys);
      p.maxY = Math.max.apply(null, p.ys);
      p.stemUp = p.meanStep < MIDDLE_STEP;
      p.tip = null;
    });

    // beam runs: consecutive flagged notes inside one beat group
    const runs = [];
    for (let i = 0; i < pieces.length; ) {
      const p = pieces[i];
      if (!p.type.flags) {

        continue;
      }
      let j = i;
      while (j + 1 < pieces.length && pieces[j + 1].type.flags && Math.abs(pieces[j + 1].tick - (pieces[j].tick + pieces[j].dur)) < 1e-6 && beamKey(layout, pieces[j + 1].tick) === beamKey(layout, p.tick)) j++;
      if (j > i) {
        const run = pieces.slice(i, j + 1);
        const up = run.reduce((s, r) => s + r.meanStep, 0) / run.length < MIDDLE_STEP;
        const beamY = up ? Math.min.apply(null, run.map((r) => r.minY)) - STEM : Math.max.apply(null, run.map((r) => r.maxY)) + STEM;
        run.forEach((r) => {
          r.stemUp = up;
          r.tip = beamY;
          r.beamed = true;
        });
        runs.push({ run, up, beamY });
      }
      i = j + 1;
    }

    const accState = {};
    let accMeasure = -1;
    const keyAcc = (letter) => {
      if (kc > 0) return SHARP_ORDER.slice(0, kc).indexOf(letter) !== -1 ? 1 : 0;
      if (kc < 0) return FLAT_ORDER.slice(0, -kc).indexOf(letter) !== -1 ? -1 : 0;
      return 0;
    };
    const drawn = new Map(); // event -> last drawn piece (for ties)

    const noteSvg = pieces.map((p) => {
      const color = 'hsl(' + p.ev.hue + ' 42% 76%)';
      const m = layout.measureAtTick(p.tick);
      if (m.index !== accMeasure) {
        accMeasure = m.index;
        Object.keys(accState).forEach((k) => delete accState[k]);
      }
      const items = p.ev.items;
      const stemX = p.stemUp ? p.x + 4.9 : p.x - 4.9;
      let parts = '';

      // ledger lines
      const ledgers = new Set();
      items.forEach((it) => ledgerSteps(it.sp.step).forEach((s) => ledgers.add(s)));
      ledgers.forEach((s) => {
        parts += '<path d="M' + f(p.x - 10) + ',' + f(stepY(s)) + 'H' + f(p.x + 10) + '" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.2"/>';
      });

      // accidentals (only where the note is struck, not on a tied continuation)
      let accCount = 0;
      if (!p.tiedFrom) {
        items.forEach((it) => {
          const cur = it.sp.step in accState ? accState[it.sp.step] : keyAcc(it.sp.letter);
          if (it.sp.acc !== cur) {
            accState[it.sp.step] = it.sp.acc;
            parts += accidentalPath(it.sp.acc, p.x - 13 - accCount * 9, stepY(it.sp.step));
            accCount++;
          }
        });

  function download(blob, name) {

      const scale = Math.min(2, MAX_PX / w, MAX_PX / h);
      const svg = svgString.replace('style="color:var(--cc-ink,#d5d8de)"', 'style="color:' + INK + '"').replace(/<ellipse class="cc-hit"[^>]*\/>/g, '');

        const c = document.createElement('canvas');

        c.height = Math.round((h + 24) * scale);
